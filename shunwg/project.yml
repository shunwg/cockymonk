# EDIT-ME: bundleIdPrefix + DEVELOPMENT_TEAM, then run `xcodegen generate`
name: Snifferoo
options:
  bundleIdPrefix: com.EDITME
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: EDITME
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Snifferoo:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Resources]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        CODE_SIGN_STYLE: Automatic
  SnifferooTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Snifferoo
