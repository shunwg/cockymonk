<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cockerel</title>
<link rel="icon" href="assets/nesen.svg" />
<link rel="stylesheet" href="assets/fredoka.css" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/app.css" />
<script>
// Stamp the saved theme before first paint so there's no flash of the
// wrong theme — must stay a plain synchronous script (not the module in
// js/ui.js, which loads too late to beat the first frame). Light is the
// default (see js/storage.js loadTheme()) — only an explicit "dark" (saved
// by the settings toggle) leaves this attribute unset, since tokens.css's
// bare :root already IS the dark palette; light is the data-theme override.
try {
  // cockerel.theme.v1 is the current key; thedailycock.theme.v1 is the
  // pre-rename key still sitting in returning players' browsers — see
  // js/storage.js's loadTheme() for the one-time migration.
  if ((localStorage.getItem("cockerel.theme.v1") ?? localStorage.getItem("thedailycock.theme.v1")) !== "dark") {
    document.documentElement.dataset.theme = "light";
  }
} catch (e) {
  document.documentElement.dataset.theme = "light"; // localStorage inaccessible (e.g. Safari private mode) — still default light
}
</script>
</head>
<body>
<div id="devbar"></div>
<div id="app" role="main">
<div id="header"></div>
<div id="screen-root"></div>
</div>
<!-- Google Identity Services — only ever used if the server reports a
     googleClientId via /api/config; harmless (just an unused global) otherwise. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/ui.js"></script>
</body>
</html>
