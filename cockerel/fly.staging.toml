# Fly.io app config for Cockerel's STAGING backend — Expo/TestFlight
# testers only. Runs the exact same server/dev-server.mjs as production
# (cockerel, see fly.toml) against its OWN isolated data volume.
# Deploy with: fly deploy -c fly.staging.toml
# Never deploy the production fly.toml with -a cockerel-staging or vice versa
# — the app name below and -c flag are what keep the two fully separate.
app = "cockerel-staging"
primary_region = "arn"

[build]

[env]
  DEV_TOOLS = "1"
  PORT = "8788"
  # DEV_TOOLS=1 keeps the #devbar test-player switcher fully independent of
  # this — it sets `identity` directly and never passes through the gate.
  # Requires GOOGLE_CLIENT_ID to also be set (fly secrets set).
  REQUIRE_GOOGLE_AUTH = "1"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "cockerel_staging_data"
  destination = "/app/server/data"
