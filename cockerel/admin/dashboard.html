<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cockerel — admin</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font-family: -apple-system, "SF Pro", system-ui, sans-serif; background: #fff; color: #1a1a1a; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
  .token-row { display: flex; gap: 8px; margin-bottom: 24px; max-width: 480px; }
  input { flex: 1; padding: 8px 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
  button { padding: 8px 16px; border: 1px solid #1a1a1a; border-radius: 8px; background: #1a1a1a; color: #fff; cursor: pointer; font-size: 14px; }
  section { margin-bottom: 32px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em; color: #444; margin-bottom: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
  th { color: #666; font-weight: 600; }
  tr:hover td { background: #fafafa; }
  .error { color: #b3261e; font-size: 14px; }
  .empty { color: #999; font-style: italic; font-size: 13px; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<h1>Cockerel — admin dashboard</h1>
<p class="sub">Read-only. Daily activity is retroactive (computed from raw logs); the player table is a live snapshot, not a historical log — there's no stored history of past ratings/streaks.</p>

<div class="token-row">
  <input id="token-input" type="text" placeholder="admin token" />
  <button id="load-btn">Load</button>
</div>

<div id="content"></div>

<script>
  const params = new URLSearchParams(location.search);
  const tokenInput = document.getElementById("token-input");
  const content = document.getElementById("content");
  if (params.get("token")) tokenInput.value = params.get("token");

  document.getElementById("load-btn").addEventListener("click", load);
  if (tokenInput.value) load();

  async function load() {
    const token = tokenInput.value.trim();
    if (!token) { content.innerHTML = '<p class="error">Enter a token.</p>'; return; }
    content.innerHTML = "<p>Loading…</p>";
    try {
      const res = await fetch(`/api/admin/stats?token=${encodeURIComponent(token)}`);
      if (res.status === 401) { content.innerHTML = '<p class="error">Wrong token.</p>'; return; }
      const data = await res.json();
      if (!data.ok) { content.innerHTML = `<p class="error">${data.error || "Request failed."}</p>`; return; }
      render(data);
    } catch (e) {
      content.innerHTML = `<p class="error">${String(e)}</p>`;
    }
  }

  function render(data) {
    content.innerHTML = "";
    content.appendChild(daySection(data.days));
    content.appendChild(playerSection(data.players, data.botCount));
  }

  function daySection(days) {
    const el = document.createElement("section");
    if (!days.length) { el.innerHTML = "<h2>Daily activity</h2><p class=\"empty\">No activity logged yet.</p>"; return el; }
    const rows = days.slice().reverse().map((d) => `
      <tr>
        <td>${d.dayKey}</td>
        <td>${d.dau}</td>
        <td>${d.correctGuesses} / ${d.totalGuesses}${pct(d.correctGuessPct)}</td>
        <td>${d.definitions} / ${d.possibleDefinitionSlots}${pct(d.definitionCompletionPct)}</td>
        <td>${d.realUsers} real / ${d.bots} bots (${d.botPct}% bots)</td>
      </tr>`).join("");
    el.innerHTML = `
      <h2>Daily activity</h2>
      <div class="scroll"><table>
        <thead><tr><th>Day</th><th>Active users</th><th>Correct guesses</th><th>Definitions (completion)</th><th>Bots vs real</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
    return el;
  }

  function playerSection(players, botCount) {
    const el = document.createElement("section");
    if (!players.length) { el.innerHTML = "<h2>Players (live)</h2><p class=\"empty\">No players yet.</p>"; return el; }
    const rows = players.map((p) => `
      <tr>
        <td>${escapeHtml(p.displayName)}</td>
        <td>${p.rating}</td>
        <td>${p.rank}</td>
        <td>${p.streakDays}</td>
        <td>${escapeHtml(p.device)}</td>
        <td>${p.lastActiveDayKey ?? "—"}</td>
      </tr>`).join("");
    el.innerHTML = `
      <h2>Players (live snapshot, ${players.length} real + ${botCount} bots on the leaderboard)</h2>
      <div class="scroll"><table>
        <thead><tr><th>Name</th><th>Rating</th><th>Rank</th><th>Streak</th><th>Device</th><th>Last active</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
    return el;
  }

  function pct(p) { return p == null ? "" : ` (${p}%)`; }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
</script>
</body>
</html>
