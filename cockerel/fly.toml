# Fly.io app config for Cockerel's Node server + static frontend.
# App name must be globally unique on Fly — change it here (and when you
# run `fly apps create`) if "cockerel" is already taken.
app = "cockerel"
primary_region = "arn"  # Stockholm — pick whatever's closest to your friends

[build]

[env]
  DEV_TOOLS = "0"
  PORT = "8788"
  # Requires GOOGLE_CLIENT_ID to also be set (fly secrets set) — the sign-in
  # gate in js/ui.js is useless without it. See cockerel/CLAUDE.md.
  REQUIRE_GOOGLE_AUTH = "1"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Kept at 1 (not 0, unlike fly.staging.toml) so production never cold-starts
  # for real players — costs ~$2/month extra (shared-cpu-1x:256MB billed
  # 24/7 instead of only while awake). Staging deliberately stays scale-to-
  # zero since only the maintainer/testers hit it.
  min_machines_running = 1

# db.json lives here (server/db.mjs's DATA_DIR) — without this mount, every
# redeploy or machine restart wipes all player data.
[mounts]
  source = "cockerel_data"
  destination = "/app/server/data"
