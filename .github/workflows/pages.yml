# Deploys the playable standalone to https://shunwg.github.io/cockymonk/
#
# THIS FILE MUST LIVE AT THE REPOSITORY ROOT.
# GitHub only reads workflows from <repo-root>/.github/workflows/. It does NOT
# recurse into subfolders. Commit 06997de ("Move existing project into shunwg/
# subfolder") renamed this file to shunwg/.github/workflows/pages.yml, and from
# that moment the deploy silently stopped running — no error, no failed run, no
# notification, because as far as GitHub was concerned the workflow no longer
# existed. Pages kept serving the last successful deployment, so the URL stayed
# up and looked healthy while going a week stale. If the repo is restructured
# again, this file stays here.
name: Deploy Pages

on:
  push:
    branches: [main]
    # Only rebuild when the game or its build inputs change. ordkrig/ lives in
    # this repo too and has its own deploy story; a push there should not
    # republish Cocky Monk.
    paths:
      - "shunwg/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The app moved into shunwg/ but the workflow file cannot (see above), so
    # every run step executes from there rather than the checkout root.
    defaults:
      run:
        working-directory: shunwg
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Build from source rather than trusting the committed dist/ — that bundle
      # is regenerated by hand and has drifted before.
      - name: Build standalone bundle from source
        run: node Tools/build-standalone.mjs

      # Fail loudly if the bundle is missing or truncated. Without this a broken
      # build deploys a blank page over a working one, and the first person to
      # notice is whoever you sent the link to.
      - name: Verify the bundle is real
        run: |
          test -s dist/Snifferoo.html
          bytes=$(wc -c < dist/Snifferoo.html)
          echo "bundle: $bytes bytes"
          test "$bytes" -gt 400000
          grep -q "<title>Snifferoo</title>" dist/Snifferoo.html

      - name: Stage site
        run: |
          mkdir site
          cp dist/Snifferoo.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          # upload-pages-artifact resolves its path from the checkout root, not
          # from the job's working-directory, so this one stays fully qualified.
          path: shunwg/site
      - id: deployment
        uses: actions/deploy-pages@v4
