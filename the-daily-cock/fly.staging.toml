# Fly.io app config for The Daily Cock's STAGING backend — Expo/TestFlight
# testers only. Runs the exact same server/dev-server.mjs as production
# (the-daily-cock, see fly.toml) against its OWN isolated data volume.
# Deploy with: fly deploy -c fly.staging.toml
# Never deploy the production fly.toml with -a daily-c-staging or vice versa
# — the app name below and -c flag are what keep the two fully separate.
app = "daily-c-staging"
primary_region = "arn"

[build]

[env]
  DEV_TOOLS = "1"
  PORT = "8788"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "daily_c_staging_data"
  destination = "/app/server/data"
