<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Cocky Monk — demo</title>
<style>
  :root{
    --inkNight:#1B1B2E; --paper:#FFF6E8; --inkText:#23233B; --paperText:#F4EFE4;
    --truthGreen:#3BD489; --bluffPink:#FF5C97; --turnYellow:#FFC53D; --gmViolet:#9B6DFF; --mutedViolet:#8A87B8;
    --radiusCard:22px; --radiusBtn:16px;
    --shadow:4px 5px 0 rgba(10,10,24,.45);
    --display:'Fredoka',ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    color:var(--paperText);
    font-family:var(--display);
    background:
      radial-gradient(600px 340px at 85% -80px, #9b6dff26, transparent 70%),
      radial-gradient(520px 320px at 0% 110%, #ff5c9722, transparent 70%),
      radial-gradient(#ffffff09 1.2px, transparent 1.2px) 0 0/26px 26px,
      var(--inkNight);
    display:flex;justify-content:center;
  }
  #app{width:100%;max-width:480px;min-height:100%;display:flex;flex-direction:column;padding:16px;position:relative;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;min-height:38px;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.3px;color:var(--paperText);font-size:17px;}
  .brand .logo{filter:drop-shadow(0 2px 0 rgba(0,0,0,.4));}
  .brand .small{font-weight:500;}
  .iconbtn{background:#ffffff10;border:2px solid #ffffff2e;color:var(--paperText);border-radius:999px;
    padding:5px 13px;font:inherit;font-weight:600;cursor:pointer;}
  h1{font-weight:700;font-size:clamp(30px,8.5vw,38px);margin:8px 0 4px;line-height:1.08;letter-spacing:-.4px;}
  h2{font-weight:600;font-size:22px;margin:16px 0 8px;letter-spacing:-.2px;}
  .sub{color:var(--mutedViolet);font-size:15px;margin:0 0 16px;line-height:1.45;}
  .eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mutedViolet);}
  .card .eyebrow{color:#8a7a5c;}
  .card{background:var(--paper);color:var(--inkText);border:2.5px solid var(--inkText);
    border-radius:var(--radiusCard);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;
    background-image:repeating-linear-gradient(0deg,transparent 0 3px,#00000006 3px 4px);}
  .card.secret{background:linear-gradient(145deg,#efe6ff,#ddccff);border-color:var(--gmViolet);
    border-style:dashed;background-image:none;}
  .word{font-family:var(--display);font-size:clamp(38px,11vw,52px);font-weight:700;line-height:1.02;
    word-break:break-word;color:var(--inkText);letter-spacing:-.5px;}
  .btn{display:block;width:100%;border:2.5px solid var(--inkText);border-radius:var(--radiusBtn);
    padding:16px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;margin-top:12px;
    background:var(--turnYellow);color:var(--inkText);box-shadow:0 5px 0 #b8860bcc;
    transition:transform .08s, box-shadow .08s;}
  .btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #b8860bcc;}
  .btn:disabled{opacity:.35;cursor:default;box-shadow:none;}
  .btn.secondary{background:#ffffff0e;color:var(--paperText);border-color:#ffffff3a;box-shadow:0 5px 0 #00000055;font-weight:600;}
  .btn.secondary:active{box-shadow:0 1px 0 #00000055;}
  .btn.gm{background:var(--gmViolet);color:#fff;box-shadow:0 5px 0 #5c3ab8;}
  .btn.gm:active{box-shadow:0 1px 0 #5c3ab8;}
  .btn.pulse:not(:disabled){animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  .modebtn{text-align:left;background:var(--paper);color:var(--inkText);border:2.5px solid var(--inkText);
    border-radius:var(--radiusCard);padding:16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;}
  .modebtn:active{transform:translateY(4px);box-shadow:1px 1px 0 rgba(10,10,24,.45);}
  .modebtn small{display:block;font-weight:500;color:#5c5645;margin-top:3px;line-height:1.35;}
  .modebtn b{font-size:18px;}
  .phones{flex:none;display:flex;gap:4px;align-items:flex-end;}
  .phoneico{width:20px;height:32px;border:2.5px solid var(--inkText);border-radius:6px;background:#fff;position:relative;}
  .phoneico::after{content:"";position:absolute;left:50%;bottom:3px;transform:translateX(-50%);
    width:6px;height:2.5px;border-radius:2px;background:var(--inkText);}
  .phoneico.p2{height:26px;background:var(--turnYellow);}
  .phoneico.p3{height:29px;background:#ffe1ec;}
  input[type=text]{width:100%;padding:14px;font:inherit;font-size:17px;border-radius:var(--radiusBtn);
    border:2.5px solid var(--inkText);background:#fff;color:var(--inkText);}
  textarea{width:100%;padding:14px;font:inherit;font-size:18px;border-radius:var(--radiusBtn);
    border:2.5px solid var(--inkText);background:#fff;color:var(--inkText);resize:none;height:100px;}
  input:focus,textarea:focus{outline:3px solid var(--turnYellow);outline-offset:1px;}
  .chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
  .pchip{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;font-weight:600;font-size:14px;
    background:#ffffff14;border:2px solid #ffffff2a;transition:transform .3s, background .3s;color:var(--paperText);}
  .card .pchip{color:var(--inkText);background:#00000010;border-color:#00000022;}
  .pchip .dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.25);}
  .pchip.done{background:var(--truthGreen);color:var(--inkText);border-color:var(--truthGreen);transform:rotateX(360deg);}
  .seg{display:flex;gap:8px;margin:8px 0;}
  .seg button{flex:1;padding:12px 6px;border-radius:var(--radiusBtn);border:2px solid #ffffff30;
    background:#ffffff0a;color:var(--paperText);font:inherit;font-weight:600;cursor:pointer;font-size:14px;}
  .seg button.on{background:var(--turnYellow);color:var(--inkText);border-color:var(--turnYellow);
    box-shadow:0 3px 0 #b8860bcc;font-weight:700;}
  .handover{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;z-index:50;
    background:radial-gradient(500px 400px at 50% 30%, #2a2a46, var(--inkNight) 75%);}
  .holdbtn{width:156px;height:156px;border-radius:50%;border:none;cursor:pointer;margin-top:28px;
    font:inherit;font-weight:700;font-size:16px;color:var(--inkText);
    background:conic-gradient(var(--turnYellow) calc(var(--p,0)*1%), #ffffff18 0);
    display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;
    box-shadow:0 6px 0 rgba(0,0,0,.45);}
  .holdbtn .inner{width:122px;height:122px;border-radius:50%;background:var(--turnYellow);
    border:2.5px solid var(--inkText);display:flex;align-items:center;justify-content:center;padding:8px;}
  .opt{display:flex;gap:12px;align-items:flex-start;background:var(--paper);color:var(--inkText);
    border:2.5px solid var(--inkText);border-radius:var(--radiusCard);padding:14px;margin-bottom:11px;
    cursor:pointer;box-shadow:var(--shadow);transition:transform .08s, box-shadow .08s;}
  .opt:active{transform:translateY(3px);box-shadow:1px 2px 0 rgba(10,10,24,.45);}
  .opt .letter{flex:none;width:38px;height:38px;border-radius:50%;background:var(--inkText);color:var(--paper);
    font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px;font-family:var(--display);}
  .opt.truth{border-color:var(--truthGreen);background:#e7fff3;box-shadow:4px 5px 0 #1d8f5b88, 0 0 22px #3bd48944;}
  .opt.bluff{border-color:var(--bluffPink);}
  .opt.decoy{border-color:var(--gmViolet);border-style:dashed;}
  .pop{animation:pop .5s cubic-bezier(.34,1.6,.64,1);}
  @keyframes pop{0%{opacity:0;transform:scale(.85) rotate(-1.5deg)}100%{opacity:1;transform:none}}
  .stagger{opacity:0;animation:rise .4s ease forwards;}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .votedots{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;align-items:center;}
  .votedots .dot{width:16px;height:16px;border-radius:50%;border:2px solid #00000033;}
  .author{display:flex;align-items:center;gap:9px;margin-top:9px;font-weight:600;font-size:14px;}
  .face{width:34px;height:34px;border-radius:50%;position:relative;flex:none;border:2.5px solid var(--inkText);}
  .face::before{content:"";position:absolute;left:7px;top:11px;width:4px;height:4px;border-radius:50%;background:var(--inkText);}
  .face::after{content:"";position:absolute;right:7px;top:11px;width:4px;height:4px;border-radius:50%;background:var(--inkText);}
  .face .smile{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:12px;height:6px;
    border:2.5px solid var(--inkText);border-top:none;border-radius:0 0 12px 12px;}
  .nose{position:absolute;left:96%;top:13px;height:9px;width:6px;border-radius:0 7px 7px 0;
    background:var(--bluffPink);border:2.5px solid var(--inkText);border-left:none;
    transform-origin:left center;transition:width .5s cubic-bezier(.34,1.56,.64,1);}
  .nose.violet{background:var(--gmViolet);} .nose.gold{background:gold;}
  .bob{animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin:26px 0 18px;}
  .boardwrap{border-radius:var(--radiusCard);border:3px solid #0a0a18;padding:16px;position:relative;
    overflow:hidden;min-height:300px;box-shadow:var(--shadow), inset 0 0 40px rgba(0,0,0,.28);}
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;position:relative;}
  .space{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;position:relative;font-family:var(--display);}
  .space .mark{position:absolute;top:-9px;right:-5px;font-size:16px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.4));}
  .space.goal{animation:goalglow 2s ease-in-out infinite;}
  @keyframes goalglow{0%,100%{box-shadow:0 0 0 0 #ffc53d00}50%{box-shadow:0 0 0 5px #ffc53d55}}
  .pawn{position:absolute;width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:15px;border:2.5px solid #0a0a18;z-index:5;
    transition:left .3s cubic-bezier(.34,1.4,.64,1), top .3s cubic-bezier(.34,1.4,.64,1);
    box-shadow:0 3px 0 rgba(0,0,0,.45);}
  .pawn.leader::after{content:"👑";position:absolute;top:-16px;font-size:12px;}
  .theme-salongen .boardwrap{background:repeating-linear-gradient(90deg,#6b4a2f 0 26px,#7a5636 26px 52px);}
  .theme-salongen .space{background:radial-gradient(circle at 35% 30%,#d4b284,#8a6a44);border:2.5px solid #4d341f;color:#3a2614;}
  .theme-fjellet .boardwrap{background:
    linear-gradient(180deg,#39507a 0%,#4c6a8f 33%,#5e7f74 33%,#6f8f6f 66%,#e8edf2 66%,#ffffff 100%);}
  .theme-fjellet .space{background:#e2ddd2;border:2.5px dashed #6b6558;color:#4a463c;}
  .theme-rom .boardwrap{background:#0D0D1F;
    background-image:radial-gradient(#ffffff66 1.2px,transparent 1.2px),radial-gradient(#ffffff33 1px,transparent 1px);
    background-size:64px 64px,92px 92px;background-position:0 0,30px 40px;}
  .theme-rom .space{background:#141430;border:2.5px solid var(--gmViolet);box-shadow:0 0 10px #9b6dff55 inset;color:#b9a8ff;}
  .confetti{position:fixed;top:-16px;width:10px;height:14px;z-index:99;animation:fall linear forwards;border-radius:2px;}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);}}
  .fade{animation:fadein .35s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .scoreline{display:flex;justify-content:space-between;font-weight:600;padding:7px 2px;border-bottom:1.5px dashed #ffffff26;align-items:center;}
  .small{font-size:13px;color:var(--mutedViolet);}
  .banner{border-radius:var(--radiusBtn);padding:12px 14px;font-weight:700;text-align:center;margin-bottom:11px;
    border:2.5px solid transparent;}
  .banner.gm{background:var(--gmViolet);color:#fff;border-color:#5c3ab8;box-shadow:0 4px 0 #5c3ab8;}
  .banner.green{background:var(--truthGreen);color:var(--inkText);border-color:#1d8f5b;box-shadow:0 4px 0 #1d8f5b;}
  .thinking{display:inline-block;animation:think 1.2s ease-in-out infinite;}
  @keyframes think{0%,100%{opacity:.4}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

/* ---------- tiny synth ---------- */
let AC=null, mute=false;
function beep(f=600,d=.08,type="sine",g=.15,when=0){
  if(mute)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),v=AC.createGain();
    o.type=type;o.frequency.value=f;v.gain.value=g;o.connect(v);v.connect(AC.destination);
    const t0=AC.currentTime+when;o.start(t0);
    v.gain.setValueAtTime(g,t0);v.gain.exponentialRampToValueAtTime(.001,t0+d);o.stop(t0+d+.02);
  }catch(e){}}
const snd={
  click:()=>beep(520,.05,"square",.08),
  flip:()=>{beep(700,.06,"triangle",.12);beep(1000,.05,"triangle",.1,.05);},
  shuffle:()=>{for(let i=0;i<6;i++)beep(300+Math.random()*500,.04,"square",.05,i*.05);},
  hop:()=>beep(340,.06,"sine",.14),
  truth:()=>{[523,659,784].forEach((f,i)=>beep(f,.16,"triangle",.14,i*.12));},
  sting:()=>{beep(180,.3,"sawtooth",.12);beep(140,.35,"sawtooth",.1,.12);},
  boing:n=>beep(260+n*70,.12,"sine",.15),
  wobble:()=>beep(200,.12,"triangle",.1),
};

}

/* ---------- options & voting ---------- */
function buildOptions(){
  const opts=[];const truthOpt={text:S.card.t,kind:"truth",authors:[]};
  for(const i of S.order){
    const b=S.bluffs[i];
    if(norm(b)===norm(S.card.t)){S.doubles.push(i);continue;}
    const same=opts.find(o=>norm(o.text)===norm(b));
    if(same)same.authors.push(i);else opts.push({text:b,kind:"bluff",authors:[i]});
  }
  S.decoys.filter(d=>d&&d.trim()).forEach(d=>opts.push({text:d.trim(),kind:"decoy",authors:[S.gm]}));
  S.options=shuffle([...opts,truthOpt]).map((o,i)=>({...o,letter:String.fromCharCode(65+i)}));
}
function scheduleBotVotes(){
  S.order.filter(i=>isBot(i)).forEach((i,k)=>{
    later(()=>{
      if(S.votes[i]!==undefined)return;
      S.votes[i]=botPick(i);snd.click();
      if(S.phase==="VOTEWAIT")render();
      maybeAllVotesIn();
    }, rnd(1500,3000)+k*rnd(700,1800));
  });
}
function botPick(i){
  const truthIdx=S.options.findIndex(o=>o.kind==="truth");
  const others=S.options.map((o,idx)=>idx).filter(idx=>idx!==truthIdx&&!S.options[idx].authors.includes(i));
  if(!others.length||Math.random()<0.35)return truthIdx;
  return others[Math.floor(Math.random()*others.length)];
}
function maybeAllVotesIn(){
  if(Object.keys(S.votes).length<S.order.length)return;
  clearTm();
  later(()=>{computeScores();S.revealIdx=0;S.phase="REVEAL";render();
             if(party()&&!userIsGm())later(autoReveal,1400);},600);
}
function rVote(){
  const voter=party()?0:S.order[S.voteIdx];const p=S.players[voter];
  shell(`

   ${S.options.map((o,i)=>o.authors.includes(voter)?"":`
     <div class="opt stagger" style="animation-delay:${i*70}ms" onclick="castVote(${i})">
       <div class="letter">${o.letter}</div><div>${esc(o.text)}</div></div>`).join("")}`);
}
window.castVote=i=>{
  snd.click();
  if(party()){
    S.votes[0]=i;S.phase="VOTEWAIT";render();maybeAllVotesIn();
  }else{
    S.votes[S.order[S.voteIdx]]=i;S.voteIdx++;
    if(S.voteIdx<S.order.length)hand(S.players[S.order[S.voteIdx]].name,()=>render());
    else hand(S.players[S.gm].name,()=>{computeScores();S.revealIdx=0;S.phase="REVEAL";render();});
  }
};
function rVoteWait(){
  const n=Object.keys(S.votes).length,total=S.order.length;
  shell(`

   ${userIsGm()?"":`<div class="banner green">${t("youVoted")}</div>`}
   ${S.options.map(o=>{
     const c=Object.values(S.votes).filter(oi=>S.options[oi]===o).length;
     return `<div class="opt" style="cursor:default">
       <div class="letter">${o.letter}</div>
       <div style="flex:1">${esc(o.text)}
         <div class="votedots">${"<span class='dot' style='background:var(--mutedViolet)'></span>".repeat(c)}
           <span class="small">${c}</span></div></div></div>`;}).join("")}
  `,{gm:userIsGm()});

/* ---------- scoring ---------- */
function computeScores(){
  const d={};S.players.forEach((_,i)=>d[i]=0);
  let truthFound=false;
  for(const[v,oi]of Object.entries(S.votes)){
    const voter=+v,opt=S.options[oi];
    if(opt.kind==="truth"){d[voter]+=2;truthFound=true;}
    else opt.authors.forEach(a=>{d[a]+=1;S.players[a].bluffVotes++;});
  }
  S.doubles.forEach(i=>d[i]+=3);
  if(!truthFound){d[S.gm]+=2;S.gmStole=true;}
  S.deltas=d;
}

/* ---------- reveal ---------- */
function revealSeq(){return [...S.options.filter(o=>o.kind!=="truth"),S.options.find(o=>o.kind==="truth")];}
function rReveal(){
  const seq=revealSeq();
  const shown=seq.slice(0,S.revealIdx);
  const done=S.revealIdx>=seq.length;
  const hostIsBot=party()&&!userIsGm();
  shell(`
   <h2>${t("revealTitle")} <span class="small">· ${t("roundN",S.round)}</span></h2>
   ${S.doubles.map(i=>`<div class="banner green">${t("doubleHit",esc(S.players[i].name))}</div>`).join("")}
   ${shown.map((o,si)=>{
      const voters=Object.entries(S.votes).filter(([,oi])=>S.options[oi]===o).map(([v])=>S.players[+v]);
      const isT=o.kind==="truth";
      return `<div class="opt ${o.kind} ${si===shown.length-1?"pop":""}" style="cursor:default">
        <div class="letter" style="${isT?"background:var(--truthGreen);color:var(--inkText)":""}">${o.letter}</div>
        <div style="flex:1">
          ${isT?`<b style="color:var(--truthGreen)">✓ ${t("theTruth")}</b><br>`:""}
          ${esc(o.text)}
          <div class="votedots">${voters.map(v=>`<span class="dot" title="${esc(v.name)}" style="background:${v.color}"></span>`).join("")}
            <span class="small">${voters.length} ${t("votes")}</span></div>
          ${!isT?`<div class="author">
             ${o.authors.map(a=>{const pl=S.players[a];const gmA=a===S.gm;
               return `<span class="face" style="background:${pl.color}">
                         <span class="nose ${gmA?"violet":""}" style="width:${6+voters.length*14}px"></span></span>
                       <span>${t("by")} ${a===0&&party()?t("you"):esc(pl.name)}${gmA?` · <span style="color:var(--gmViolet)">${t("gmDecoy")}</span>`:""}</span>`;}).join("")}
           </div>`:""}
        </div></div>`;}).join("")}
   ${done&&S.gmStole?`<div class="banner gm">😈 ${t("gmSteal")}</div>`:""}
   <div style="flex:1"></div>
   ${done
     ?`<button class="btn" onclick="goBoard()">${t("toBoard")}</button>`
     :`<button class="btn gm" onclick="manualReveal()">${hostIsBot?t("skip"):t("tapReveal")}</button>`}
  `,{gm:userIsGm()||!party()});
}
function doRevealStep(){
  const seq=revealSeq();
  if(S.revealIdx>=seq.length)return;
  const isTruth=S.revealIdx===seq.length-1;
  S.revealIdx++;
  if(isTruth){snd.truth();if(S.gmStole)setTimeout(snd.sting,500);}
  else{const o=seq[S.revealIdx-1];
       const v=Object.values(S.votes).filter(oi=>S.options[oi]===o).length;snd.boing(v);}
  render();
}
window.manualReveal=()=>{clearTm();doRevealStep();
  if(party()&&!userIsGm()&&S.revealIdx<revealSeq().length)later(autoReveal,1700);};
function autoReveal(){
  if(S.phase!=="REVEAL")return;
  doRevealStep();
  if(S.revealIdx<revealSeq().length)later(autoReveal,1700);
  else later(goBoard,1600);
}
window.goBoard=()=>{if(S.phase==="BOARD")return;clearTm();snd.click();
  S.phase="BOARD";render();setTimeout(animateBoard,400);};

/* ---------- board ---------- */
function cellPos(i){const row=Math.floor(i/5);let col=i%5;if(row%2)col=4-col;return{row,col};}
function rBoard(){
  const T=S.target;const th=MARKS[S.theme];const marks={};
  marks[Math.floor(T/3)]=th[0];marks[Math.floor(2*T/3)]=th[1];marks[T]=th[2];
  let cells="";
  for(let i=0;i<=T;i++){const{row,col}=cellPos(i);
    cells+=`<div class="space ${i===T?"goal":""}" data-i="${i}" style="grid-row:${row+1};grid-column:${col+1}">
              ${i===0?"▶":i}${marks[i]?`<span class="mark">${marks[i]}</span>`:""}</div>`;}
  shell(`
   <h2>${t("board")}</h2><p class="sub">${t("boardSub",T)}</p>
   <div class="boardwrap"><div class="board">${cells}</div><div id="pawns"></div></div>
   <div style="margin-top:10px">
     ${S.players.map((p,i)=>`<div class="scoreline">
        <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${p.color}"></span>
        ${esc(p.name)} ${i===S.gm?"👑":""} <span class="small">👃${p.bluffVotes}</span>
        ${S.deltas[i]?`<b style="color:var(--turnYellow)">+${S.deltas[i]}</b>`:""}</span>
        <span id="sc${i}">${p.score} ${t("pts")}</span></div>`).join("")}
   </div>
   <div style="flex:1"></div>
   <button class="btn" id="nextbtn" disabled>${t("nextRound")}</button>`);
  placePawns();
}
function pawnEl(i){
  let el=document.getElementById("pw"+i);
  if(!el){el=document.createElement("div");el.id="pw"+i;el.className="pawn";
    el.style.background=S.players[i].color;el.textContent=PAWN_ICON[S.theme];
    document.getElementById("pawns").appendChild(el);}
  return el;
}
function moveTo(i,space,offset){
  const cell=document.querySelector(`.space[data-i="${Math.min(space,S.target)}"]`);
  if(!cell)return;
  const wrap=document.querySelector(".boardwrap").getBoundingClientRect();
  const r=cell.getBoundingClientRect();
  const el=pawnEl(i);
  el.style.left=(r.left-wrap.left+r.width/2-15+offset*7)+"px";
  el.style.top =(r.top -wrap.top +r.height/2-15-offset*5)+"px";
}
function placePawns(){S.players.forEach((p,i)=>moveTo(i,p.score,i));markLeader();}
function markLeader(){
  const max=Math.max(...S.players.map(p=>p.score));
  S.players.forEach((p,i)=>pawnEl(i).classList.toggle("leader",p.score===max&&max>0));
}
function animateBoard(){
  const earners=S.players.map((_,i)=>i).filter(i=>S.deltas[i]>0);
  let e=0;
  const nextEarner=()=>{
    if(e>=earners.length)return finishRound();
    const i=earners[e++];let steps=S.deltas[i];
    const hop=()=>{
      if(steps--<=0){markLeader();return setTimeout(nextEarner,250);}
      S.players[i].score++;
      snd.hop();if(navigator.vibrate)navigator.vibrate(10);
      moveTo(i,S.players[i].score,i);
      const sc=document.getElementById("sc"+i);if(sc)sc.textContent=S.players[i].score+" "+t("pts");
      setTimeout(hop,330);
    };hop();
  };
  setTimeout(nextEarner,300);
}
window.animateBoard=animateBoard;
function finishRound(){
  S.deltas={};
  const rotationDone=(S.round%S.players.length)===0;
  const past=S.players.filter(p=>p.score>=S.target);
  if(rotationDone&&past.length){S.phase="WINNER";snd.truth();render();confetti();return;}
  const btn=document.getElementById("nextbtn");if(!btn)return;
  btn.disabled=false;
  btn.onclick=()=>{S.gm=(S.gm+1)%S.players.length;newRound();};
}

/* ---------- winner ---------- */
function rWinner(){
  const max=Math.max(...S.players.map(p=>p.score));
  const winners=S.players.filter(p=>p.score===max);
  const liar=[...S.players].sort((a,b)=>b.bluffVotes-a.bluffVotes)[0];
  shell(`
   <div style="flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;">
     <h1 style="font-size:42px">🏆</h1>
     <h1>${winners.length>1?t("shared"):t("winner",esc(winners[0].name))}</h1>
     <p class="sub">${t("restOfYou")}</p>
     <div class="card" style="display:flex;gap:12px;align-items:center;justify-content:center;">
       <span class="face" style="background:${liar.color};width:48px;height:48px;">
         <span class="nose gold" style="top:20px;width:${10+liar.bluffVotes*10}px;height:10px;"></span></span>
       <b>${t("goldNose",esc(liar.name))} (👃 ${liar.bluffVotes})</b></div>
     <div style="margin-top:14px">${[...S.players].sort((a,b)=>b.score-a.score).map(p=>`
        <div class="scoreline"><span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${p.color}"></span> ${esc(p.name)}</span><span>${p.score} ${t("pts")}</span></div>`).join("")}</div>
   </div>
   <button class="btn" onclick="replay()">${t("playAgain")}</button>`);
}
window.replay=()=>{clearTm();
  const keep={lang:S.lang,mode:S.mode,players:S.players.map(p=>({...p,score:0,bluffVotes:0})),
              target:S.target,theme:S.theme,botCount:S.botCount,uname:S.uname};
  fresh();Object.assign(S,keep);S.phase="SETUP";render();};

function confetti(){
  const cols=["#FFC53D","#FF5C97","#3BD489","#9B6DFF","#4FC3F7"];
  for(let i=0;i<80;i++){
    const c=document.createElement("div");c.className="confetti";
    c.style.left=Math.random()*100+"vw";c.style.background=cols[i%cols.length];
    c.style.animationDuration=(2+Math.random()*2)+"s";c.style.animationDelay=(Math.random()*0.8)+"s";
    document.body.appendChild(c);setTimeout(()=>c.remove(),5000);
  }
}

render();
</script>
</body>
</html>
