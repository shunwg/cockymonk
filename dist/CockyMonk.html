  --color-accent-turn: #FFC53D;
  --color-status-success: #3BD489;
  --color-status-warning: #FFC53D;
  --color-status-error: #FF5C97;
  --color-status-info: #9B6DFF;
  --color-timer-calm: #8A87B8;
  --color-timer-warn: #FFC53D;
  --color-timer-urgent: #FF5C97;
  --color-bg-layers-glow-violet: #9B6DFF26;
  --color-bg-layers-glow-pink: #FF5C9722;
  --color-bg-layers-dot-grid: #FFFFFF09;

  /* ---- color.themes — background-layer overrides only (DESIGN.md §3) ---- */
  --color-theme-salongen-board-base: #6B4A2F;
  --color-theme-salongen-board-alt: #7A5636;
  --color-theme-salongen-rail: #3C2817;
  --color-theme-fjellet-sky: #39507A;
  --color-theme-fjellet-sky-low: #4C6A8F;
  --color-theme-fjellet-forest: #5E7F74;
  --color-theme-fjellet-forest-low: #6F8F6F;
  --color-theme-fjellet-snow: #E8EDF2;
  --color-theme-fjellet-snow-peak: #FFFFFF;
  --color-theme-fjellet-rail: #6B6558;
  --color-theme-verdensrommet-space: #0D0D1F;
  --color-theme-verdensrommet-star-bright: #FFFFFF66;
  --color-theme-verdensrommet-star-dim: #FFFFFF33;
  --color-theme-verdensrommet-rail: #241A4A;

  /* ---- radius ---- */
  --radius-card: 22px;
  --radius-button: 16px;
  --radius-chip: 999px;

  /* ---- shadow (hard offset, no blur — DESIGN.md §2) ---- */
  --shadow-hard: 4px 5px 0 rgba(10,10,24,0.45);
  --shadow-hard-pressed: 1px 1px 0 rgba(10,10,24,0.45); /* press: translateY(4px) + compressed shadow */
  --shadow-press-translate: 4px;

  /* ---- type ---- */
  --type-display-family: 'Fredoka', ui-rounded, -apple-system, 'SF Pro Rounded', system-ui, sans-serif;
  --type-display-weights: 600 700; /* informational */
  --type-card-word-size: clamp(38px, 11vw, 52px);
  --type-card-word-weight: 700;
  --type-card-word-tracking: -0.5px;
  --type-card-word-line-height: 1.02;
  --type-h1-size: clamp(30px, 8.5vw, 38px);
  --type-h1-weight: 700;
  --type-h1-tracking: -0.4px;
  --type-h1-line-height: 1.08;
  --type-h2-size: 22px;
  --type-h2-weight: 600;
  --type-h2-tracking: -0.2px;
  --type-body-size: 17px;
  --type-body-weight: 400;
  --type-sub-size: 15px;
  --type-eyebrow-size: 12px;
  --type-eyebrow-weight: 700;
  --type-eyebrow-tracking: 0.14em;

  /* ---- motion.durations (Reduced Motion: see tokens.json motion.durations._reducedMotion) ---- */
  --motion-dur-button-press: 80ms;
  --motion-dur-chip-flip: 300ms;
  --motion-dur-option-stagger-gap: 70ms;
  --motion-dur-option-rise: 400ms;
  --motion-dur-reveal-pop: 500ms;
  --motion-dur-nose-grow: 500ms;
  --motion-dur-pawn-hop: 350ms;
  --motion-dur-pawn-hop-cadence: 330ms;
  --motion-dur-fade-in: 350ms;
  --motion-dur-vote-open-delay: 1200ms;
  --motion-dur-bot-reveal-beat: 1700ms;
  --motion-dur-reveal-to-board: 1600ms;
  --motion-dur-armed-pulse: 1400ms;
  --motion-dur-think-pulse: 1200ms;
  --motion-dur-timer-tick: 250ms;
  --motion-dur-timer-ring-sweep: 1000ms;
  --motion-dur-timer-urgent-pulse: 700ms;
  --motion-dur-bob-loop: 2400ms;
  --motion-dur-goal-pulse: 2000ms;
  --motion-dur-confetti-fall-min: 2000ms;
  --motion-dur-confetti-fall-max: 4000ms;
  --motion-dur-gm-chuckle-max: 800ms;
  --motion-dur-one-shot-max: 1500ms;
  --motion-dur-board-phase-cap: 20000ms;
  --motion-dur-overtake-wobble: 420ms;
  --motion-dur-count-up: 280ms;
  --motion-dur-screen-in: 240ms;

  /* ---- motion.springs (duration in s + cubic-bezier approximation) ---- */
  --spring-button-press-duration: 0.08s;
  --spring-button-press-ease: cubic-bezier(0.34, 1, 0.64, 1);
  --spring-chip-flip-duration: 0.3s;
  --spring-chip-flip-ease: cubic-bezier(0.34, 1.225, 0.64, 1);
  --spring-option-stagger-duration: 0.4s;
  --spring-option-stagger-ease: cubic-bezier(0.34, 1, 0.64, 1);
  --spring-reveal-pop-duration: 0.5s;
  --spring-reveal-pop-ease: cubic-bezier(0.34, 1.6, 0.64, 1);
  --spring-nose-grow-duration: 0.5s;
  --spring-nose-grow-ease: cubic-bezier(0.34, 1.555, 0.64, 1);
  --spring-pawn-hop-duration: 0.35s;
  --spring-pawn-hop-ease: cubic-bezier(0.34, 1.405, 0.64, 1);
  --spring-truth-reveal-duration: 0.5s;
  --spring-truth-reveal-ease: cubic-bezier(0.34, 1.3, 0.64, 1);
  --spring-gm-steal-pulse-duration: 0.6s;
  --spring-gm-steal-pulse-ease: cubic-bezier(0.34, 1, 0.64, 1);
  --spring-bob-idle-duration: 2.4s;
  --spring-bob-idle-ease: cubic-bezier(0.34, 1, 0.64, 1);
  --spring-goal-pulse-duration: 2s;
  --spring-goal-pulse-ease: cubic-bezier(0.34, 1, 0.64, 1);
  --spring-tally-pop-duration: 0.28s;
  --spring-tally-pop-ease: cubic-bezier(0.34, 1.525, 0.64, 1);
}

/* Reduced Motion (DESIGN.md §9): hops → slides, pops/bobs → crossfades,
 * nose growth → crossfade to final length, drifting stars → static. */
@media (prefers-reduced-motion: reduce) {
  :root {
    --spring-button-press-ease: ease-out;
    --spring-chip-flip-ease: ease-out;
    --spring-option-stagger-ease: ease-out;
    --spring-reveal-pop-ease: ease-out;
    --spring-nose-grow-ease: ease-out;
    --spring-pawn-hop-ease: ease-out;
    --spring-truth-reveal-ease: ease-out;
    --spring-gm-steal-pulse-ease: ease-out;
    --spring-bob-idle-ease: ease-out;
    --spring-goal-pulse-ease: ease-out;
    --spring-tally-pop-ease: ease-out;
  }
}

/* base.css */
/* base.css — app shell, typography, cards, buttons, inputs. Lane B.
 * Every value that exists as a token MUST come from tokens.css. */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }

body {
  color: var(--color-text-on-bg);
  font-family: var(--type-display-family);
  background:
    radial-gradient(600px 340px at 85% -80px, var(--color-bg-layers-glow-violet), transparent 70%),
    radial-gradient(520px 320px at 0% 110%, var(--color-bg-layers-glow-pink), transparent 70%),
    radial-gradient(var(--color-bg-layers-dot-grid) 1.2px, transparent 1.2px) 0 0 / 26px 26px,
    var(--color-bg);
  display: flex;
  justify-content: center;
}

#app {
  width: 100%;
  max-width: 480px;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding: 16px;
  position: relative;
}

.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; min-height: 38px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: .3px; color: var(--color-text-on-bg); font-size: 17px; }
.brand .logo { filter: drop-shadow(0 2px 0 rgba(0,0,0,.4)); }
.brand .small { font-weight: 500; }
.iconbtn {
  background: #ffffff10; border: 2px solid #ffffff2e; color: var(--color-text-on-bg);
  border-radius: var(--radius-chip); padding: 5px 13px; font: inherit; font-weight: 600; cursor: pointer;
  min-height: 44px; min-width: 44px;   /* touch target (DESIGN §9) */
}
.iconbtn:focus-visible { outline: 3px solid var(--color-accent-turn); outline-offset: 2px; }

h1 { font-weight: var(--type-h1-weight); font-size: var(--type-h1-size); margin: 8px 0 4px; line-height: var(--type-h1-line-height); letter-spacing: var(--type-h1-tracking); }
h2 { font-weight: var(--type-h2-weight); font-size: var(--type-h2-size); margin: 16px 0 8px; letter-spacing: var(--type-h2-tracking); }
.sub { color: var(--color-text-secondary); font-size: var(--type-sub-size); margin: 0 0 16px; line-height: 1.45; }
.small { font-size: 13px; color: var(--color-text-secondary); }
.eyebrow {
  display: inline-flex; align-items: center; gap: 7px; font-size: var(--type-eyebrow-size); font-weight: var(--type-eyebrow-weight);
  letter-spacing: var(--type-eyebrow-tracking); text-transform: uppercase; color: var(--color-text-secondary);
}
.eyebrow::before { content: ""; width: 14px; height: 2px; border-radius: 2px; background: currentColor; opacity: .55; }
.card .eyebrow { color: #8a7a5c; }

.card {
  background: var(--color-surface); color: var(--color-text-on-surface);
  border: 2.5px solid var(--color-border); border-radius: var(--radius-card);
  padding: 18px; box-shadow: var(--shadow-hard); margin-bottom: 14px;
  background-image: repeating-linear-gradient(0deg, transparent 0 3px, #00000006 3px 4px); /* paper grain */
}
.card.secret {
  /* The lavender gradient IS the background-image; it also overrides .card's paper
     grain, so no separate grain-suppression is needed. (A stray `background-image:
     none` here previously erased the gradient → transparent card → unreadable truth.) */
  background: linear-gradient(145deg, #efe6ff, #ddccff);
  border-color: var(--color-accent-gm); border-style: dashed;   /* "classified" */
  box-shadow: var(--shadow-hard), inset 0 0 22px #9b6dff1f;     /* faint dossier glow */
}

.word {
  font-family: var(--type-display-family); font-size: var(--type-card-word-size);
  font-weight: var(--type-card-word-weight); line-height: var(--type-card-word-line-height);
  word-break: break-word; color: var(--color-text-on-surface); letter-spacing: var(--type-card-word-tracking);
  text-shadow: 0 1px 0 #ffffffcc, 0 -1px 0 #0000000f;   /* letterpress — pressed into the paper */
}

.btn {
  display: block; width: 100%; border: 2.5px solid var(--color-border); border-radius: var(--radius-button);
  padding: 16px; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 12px;
  background: var(--color-accent-turn); color: var(--color-text-on-surface); box-shadow: 0 5px 0 #b8860bcc;
  transition: transform var(--motion-dur-button-press), box-shadow var(--motion-dur-button-press);
}
.btn:active:not(:disabled) { transform: translateY(var(--shadow-press-translate)); box-shadow: 0 1px 0 #b8860bcc; }
.btn:disabled { opacity: .35; cursor: default; box-shadow: none; }
.btn.secondary { background: #ffffff0e; color: var(--color-text-on-bg); border-color: #ffffff3a; box-shadow: 0 5px 0 #00000055; font-weight: 600; }
.btn.secondary:active { box-shadow: 0 1px 0 #00000055; }
.btn.gm { background: var(--color-accent-gm); color: #fff; box-shadow: 0 5px 0 #5c3ab8; }
.btn.gm:active { box-shadow: 0 1px 0 #5c3ab8; }
.btn.pulse:not(:disabled) { animation: pulse var(--motion-dur-armed-pulse) ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
.btn:focus-visible { outline: 3px solid var(--color-accent-turn); outline-offset: 3px; }

input[type=text] {
  width: 100%; padding: 14px; font: inherit; font-size: 17px; border-radius: var(--radius-button);
  border: 2.5px solid var(--color-border); background: #fff; color: var(--color-text-on-surface);
}
textarea {
  width: 100%; padding: 14px; font: inherit; font-size: 18px; border-radius: var(--radius-button);
  border: 2.5px solid var(--color-border); background: #fff; color: var(--color-text-on-surface);
  resize: none; height: 100px;
}
input:focus, textarea:focus { outline: 3px solid var(--color-accent-turn); outline-offset: 1px; }

/* Snappy default entrance (movement starts immediately → feels faster). Only real
   screen changes get it — ui.js gates the class so mid-screen updates don't re-fade. */
.fade { animation: fadein var(--motion-dur-screen-in) cubic-bezier(0.23, 1, 0.32, 1); }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* Ceremony jumps (into reveal/board/winner) earn a richer settle */
.fade.ceremony { animation: ceremonyIn var(--spring-reveal-pop-duration) var(--spring-reveal-pop-ease); }
@keyframes ceremonyIn { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  /* Elements whose ONLY path to visibility is an animation must be shown outright,
     or Reduced-Motion players never see them (e.g. the vote options). */
  .stagger, .opt.stagger { opacity: 1 !important; }
}

/* components.css */
/* components.css — chips, segments, options, faces/noses, banners, mode buttons,
 * handover hold-button, confetti. Lane B. Token-pure. */

.modebtn {
  text-align: left; background: var(--color-surface); color: var(--color-text-on-surface);
  border: 2.5px solid var(--color-border); border-radius: var(--radius-card); padding: 16px;
  box-shadow: var(--shadow-hard); display: flex; gap: 14px; align-items: center;
}
.modebtn:active { transform: translateY(var(--shadow-press-translate)); box-shadow: var(--shadow-hard-pressed); }
.modebtn small { display: block; font-weight: 500; color: #5c5645; margin-top: 3px; line-height: 1.35; }
.modebtn b { font-size: 18px; }
.phones { flex: none; display: flex; gap: 4px; align-items: flex-end; }
.phoneico { width: 20px; height: 32px; border: 2.5px solid var(--color-border); border-radius: 6px; background: #fff; position: relative; }
.phoneico::after {
  content: ""; position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%);
  width: 6px; height: 2.5px; border-radius: 2px; background: var(--color-border);
}
.phoneico.p2 { height: 26px; background: var(--color-accent-turn); }
.phoneico.p3 { height: 29px; background: #ffe1ec; }

/* ---- phase countdown (PRD §5.2a) ----------------------------------------
   --p is the fraction still to run, 1 → 0, and is the ONLY property the
   per-second repaint writes (ui.js ckPaint) — never a re-render, which would
   eat the bluff textarea 60x/min.
   DESIGN.md §9, nothing by colour alone: the numeral counts down, and at
   urgent the ring thins to a hollow outline. Both survive Reduced Motion,
   where base.css kills the transition and the ring simply snaps. */
/* Career rating badge (PRD §2.1) — quiet by design; the Nose and the Board
   own the drama (DESIGN.md §5 boldness budget). */
.ratingpill {
  display: inline-block; margin-left: 6px; padding: 2px 10px; border-radius: 999px;
  background: rgba(255,255,255,.08); border: 1px solid var(--color-text-secondary);
  color: var(--color-text-secondary); font-size: 13px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* Announced, never drawn — the countdown's VoiceOver channel. */
.sr-live {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.clockwrap { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; }
.clockwrap .clocklabel { color: var(--color-text-secondary); font-size: 14px; }
.clock {
  --clockcol: var(--color-timer-calm);
  position: relative; width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%;
  background: conic-gradient(var(--clockcol) calc(var(--p, 1) * 360deg), rgba(255,255,255,.10) 0);
  transition: background var(--motion-dur-timer-tick) linear;
  display: grid; place-items: center;
}
.clock::after {
  content: ""; position: absolute; inset: 5px; border-radius: 50%;
  background: var(--color-bg); transition: inset var(--motion-dur-timer-tick) linear;
}
.clock .clocknum {
  position: relative; z-index: 1;
  font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums;
  color: var(--color-text-on-bg);
}
.clock.warn { --clockcol: var(--color-timer-warn); }
.clock.urgent { --clockcol: var(--color-timer-urgent); }
.clock.urgent::after { inset: 3px; }            /* ring thins — a shape change, not just a hue */
.clock.urgent .clocknum { color: var(--color-timer-urgent); }
@media (prefers-reduced-motion: no-preference) {
  .clock.urgent { animation: clockpulse var(--motion-dur-timer-urgent-pulse) ease-in-out infinite; }
}
@keyframes clockpulse { 50% { transform: scale(1.08); } }

.chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.pchip {
  display: flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: var(--radius-chip);
  font-weight: 600; font-size: 14px; background: #ffffff14; border: 2px solid #ffffff2a;
  transition: transform var(--spring-chip-flip-duration) var(--spring-chip-flip-ease),
              background var(--spring-chip-flip-duration), box-shadow var(--spring-chip-flip-duration);
  color: var(--color-text-on-bg); box-shadow: 0 2px 0 rgba(0,0,0,.28);
}
.card .pchip { color: var(--color-text-on-surface); background: #00000010; border-color: #00000022; }
.pchip .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; border: 2px solid rgba(0,0,0,.25); }
.pchip.done {
  background: var(--color-accent-truth); color: var(--color-text-on-surface); border-color: var(--color-accent-truth);
  transform: rotateX(360deg) scale(1.04); box-shadow: 0 2px 0 #1d8f5b;   /* mechanical snap + truthGreen under-shadow */
}

.seg { display: flex; gap: 8px; margin: 8px 0; }
.seg button {
  flex: 1; padding: 12px 6px; border-radius: var(--radius-button); border: 2px solid #ffffff30;
  background: #ffffff0a; color: var(--color-text-on-bg); font: inherit; font-weight: 600; cursor: pointer; font-size: 14px;
}
.seg button.on {
  background: var(--color-accent-turn); color: var(--color-text-on-surface); border-color: var(--color-accent-turn);
  box-shadow: 0 3px 0 #b8860bcc; font-weight: 700;
}

.opt {
  display: flex; gap: 12px; align-items: flex-start; background: var(--color-surface); color: var(--color-text-on-surface);
  border: 2.5px solid var(--color-border); border-radius: var(--radius-card); padding: 14px; margin-bottom: 11px;
  cursor: pointer; box-shadow: var(--shadow-hard);
  transition: transform var(--motion-dur-button-press), box-shadow var(--motion-dur-button-press);
}
.opt:active { transform: translateY(3px); box-shadow: var(--shadow-hard-pressed); }
.opt .letter {
  flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--color-border); color: var(--color-surface);
  font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 18px; font-family: var(--type-display-family);
}
/* tinted hard shadows → each option reads as a colored physical tile (color means something) */
.opt.truth { border-color: var(--color-accent-truth); background: #e7fff3; box-shadow: 4px 5px 0 #1d8f5b88, 0 0 22px #3bd48944; }
.opt.bluff { border-color: var(--color-accent-bluff); box-shadow: 4px 5px 0 #c23a6a88; }
.opt.decoy { border-color: var(--color-accent-gm); border-style: dashed; box-shadow: 4px 5px 0 #6b4bb888; }

.pop { animation: pop var(--spring-reveal-pop-duration) var(--spring-reveal-pop-ease); }
@keyframes pop { 0% { opacity: 0; transform: scale(.85) rotate(-1.5deg); } 100% { opacity: 1; transform: none; } }
.stagger { opacity: 0; animation: rise var(--motion-dur-option-rise) var(--spring-option-stagger-ease) forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Truth's dramatic entrance: dim + blur the losers, then the truth settles 1.06→1.0 (DESIGN §7) */
.reveal.truth-shown .opt:not(.truth) { opacity: .45; filter: blur(1.5px); transition: opacity .3s ease, filter .3s ease; }
.opt.truth-enter { animation: truthSettle var(--spring-truth-reveal-duration) var(--spring-truth-reveal-ease) both; }
@keyframes truthSettle { 0% { transform: scale(1.06); opacity: .4; } 100% { transform: scale(1); opacity: 1; } }

/* GM steal — the villain veil pulses gmViolet once (DESIGN §7); auto-removed on next render */
.gm-tint {
  position: fixed; inset: 0; z-index: 80; pointer-events: none; background: var(--color-accent-gm);
  animation: gmTint var(--spring-gm-steal-pulse-duration) var(--spring-gm-steal-pulse-ease) both;
}
@keyframes gmTint { 0% { opacity: 0; } 45% { opacity: .5; } 100% { opacity: 0; } }

.votedots { display: flex; gap: 4px; margin-top: 7px; flex-wrap: wrap; align-items: center; }
.votedots .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #00000033; }
.votedots .dot.land { animation: dotPop var(--spring-tally-pop-duration) var(--spring-tally-pop-ease) both; }
@keyframes dotPop { 0% { transform: scale(.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.author { display: flex; align-items: center; gap: 9px; margin-top: 9px; font-weight: 600; font-size: 14px; }

/* The face + Nesen — the signature (DESIGN.md §4). The Monk has moods. */
.face { width: 34px; height: 34px; border-radius: 50%; position: relative; flex: none; border: 2.5px solid var(--color-border); }
.face::before { content: ""; position: absolute; left: 7px; top: 11px; width: 4px; height: 4px; border-radius: 50%; background: var(--color-border); transition: transform .18s ease, height .18s ease; }
.face::after { content: ""; position: absolute; right: 7px; top: 11px; width: 4px; height: 4px; border-radius: 50%; background: var(--color-border); transition: transform .18s ease, height .18s ease; }
.face .smile {
  position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); width: 12px; height: 6px;
  border: 2.5px solid var(--color-border); border-top: none; border-radius: 0 0 12px 12px; transition: all .18s ease;
}
/* suspicious — narrowed eyes, flat mouth (shown while others are bluffing) */
.face.suspicious::before, .face.suspicious::after { height: 2px; border-radius: 2px; top: 12px; }
.face.suspicious .smile { height: 0; width: 10px; border-radius: 0; border-bottom-width: 2.5px; }
/* smug — a sly smirk (the GM who just stole the round) */
.face.smug .smile { width: 14px; height: 5px; transform: translateX(-40%) rotate(-12deg); }
.face.smug::after { transform: scaleY(1.4); }
/* shocked — wide eyes, round mouth (a double-hit) */
.face.shocked::before, .face.shocked::after { transform: scale(1.5); }
.face.shocked .smile { width: 9px; height: 9px; border: 2.5px solid var(--color-border); border-radius: 50%; bottom: 4px; }
/* delighted — big grin (the winner) */
.face.delighted .smile { width: 16px; height: 9px; border-radius: 0 0 16px 16px; }

/* Vote-open flash + GM-steal screen shake — showmanship, RM-guarded in JS */
.flash { position: fixed; inset: 0; z-index: 85; pointer-events: none; background: var(--color-accent-turn); animation: flashFade .5s ease-out both; }
@keyframes flashFade { 0% { opacity: .55; } 100% { opacity: 0; } }
.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)} }
.nose {
  position: absolute; left: 96%; top: 13px; height: 9px; width: 6px; border-radius: 0 7px 7px 0;
  background: var(--color-accent-bluff); border: 2.5px solid var(--color-border); border-left: none;
  transform-origin: left center;
  box-shadow: inset 0 1px 0 #ffffff66, inset 0 -1px 0 #00000022;   /* inked-on-paper */
}
/* The Nesen boings out per vote — mount keyframe (the element is rebuilt at final width each
   reveal beat, so a transition can't fire; a stronger vote count boings harder). DESIGN §4. */
.nose.grow { animation: noseBoing var(--spring-nose-grow-duration) var(--spring-nose-grow-ease) both; }
@keyframes noseBoing {
  0%   { transform: scaleX(calc(0.25 + 0.12 * var(--votes, 1))); }
  100% { transform: scaleX(1); }
}
.nose.violet { background: var(--color-accent-gm); }
.nose.gold { background: gold; }

.bob { animation: bob var(--motion-dur-bob-loop) ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-7px) rotate(1.5deg); } }

.banner {
  border-radius: var(--radius-button); padding: 12px 14px; font-weight: 700; text-align: center;
  margin-bottom: 11px; border: 2.5px solid transparent;
}
.banner.gm { background: var(--color-accent-gm); color: #fff; border-color: #5c3ab8; box-shadow: 0 4px 0 #5c3ab8; }
.banner.green { background: var(--color-accent-truth); color: var(--color-text-on-surface); border-color: #1d8f5b; box-shadow: 0 4px 0 #1d8f5b; }

.thinking { display: inline-block; animation: think var(--motion-dur-think-pulse) ease-in-out infinite; }
@keyframes think { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }

.handover {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 24px; z-index: 50;
  background: radial-gradient(500px 400px at 50% 30%, #2a2a46, var(--color-bg) 75%);
}
.holdbtn {
  width: 156px; height: 156px; border-radius: 50%; border: none; cursor: pointer; margin-top: 28px;
  font: inherit; font-weight: 700; font-size: 16px; color: var(--color-text-on-surface);
  background: conic-gradient(var(--color-accent-turn) calc(var(--p, 0) * 1%), #ffffff18 0);
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none; touch-action: none;
  box-shadow: 0 6px 0 rgba(0,0,0,.45);
}
.holdbtn .inner {
  width: 122px; height: 122px; border-radius: 50%; background: var(--color-accent-turn);
  border: 2.5px solid var(--color-border); display: flex; align-items: center; justify-content: center; padding: 8px;
}

.confetti {
  position: fixed; top: -16px; width: 10px; height: 14px; z-index: 99;
  animation: fall linear forwards; border-radius: 2px;
}
@keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }

/* Lottie celebration overlays (motion-designer assets) — sit above content,
   never intercept taps. Reduced Motion: lottie.js never mounts them. */
.lottie-overlay {
  position: fixed; inset: 0; z-index: 90; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
.lottie-overlay > svg { width: 100%; height: 100%; }
.gullnese-fx { position: absolute; inset: 0; pointer-events: none; }
.gullnese-fx > svg { width: 100%; height: 100%; }

/* Keyboard / Switch-Control focus on every interactive tile (DESIGN §9) */
.opt:focus-visible, .seg button:focus-visible, .modebtn:focus-visible {
  outline: 3px solid var(--color-accent-turn); outline-offset: 2px;
}

/* screens.css */
/* screens.css — screen-level layout: hero, board, scoreboard. Lane B. */

.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; margin: 26px 0 18px; }

/* ---------- board frame: a real routed box, lit from above ---------- */
.boardwrap {
  border-radius: var(--radius-card); border: 3px solid #0a0a18; padding: 18px; position: relative;
  overflow: hidden; min-height: 300px;
  box-shadow:
    var(--shadow-hard),
    inset 0 1px 0 rgba(255,255,255,.10),   /* top bevel highlight */
    inset 0 0 0 2px rgba(0,0,0,.35),        /* routed inner frame line */
    inset 0 0 64px rgba(0,0,0,.42);         /* vignette → focus the track */
}
.boardwrap::after {                          /* themed material rail; never intercepts taps */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 0 6px var(--board-rail, transparent);
}
.board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; position: relative; z-index: 1; }
.track-path { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.track-path polyline { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 12; opacity: .7; }

.space {
  aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; position: relative; font-family: var(--type-display-family);
  box-shadow: inset 0 2px 2px rgba(255,255,255,.30), inset 0 -3px 4px rgba(0,0,0,.28), 0 2px 0 rgba(0,0,0,.35);
}
.space .mark { position: absolute; top: -9px; right: -5px; font-size: 16px; filter: drop-shadow(0 1px 0 rgba(0,0,0,.4)); }

/* Mål — a gold medallion that pulses "claim me" (all themes inherit; DESIGN §5) */
.board .space.goal {
  background: radial-gradient(circle at 50% 34%, #fff2c0 0%, var(--color-accent-turn) 46%, #d99a1a 100%);
  border: 2.5px solid #8a5a12; color: #5a3d08;
  animation: goalglow var(--motion-dur-goal-pulse) ease-in-out infinite;
}
@keyframes goalglow {
  0%, 100% { box-shadow: 0 0 0 0 #ffc53d00, inset 0 0 0 2px #ffe38a99; }
  50%      { box-shadow: 0 0 0 9px #ffc53d33, 0 0 20px 5px #ffc53d66, inset 0 0 0 2px #ffffff; }
}

/* ---------- pawns: domed physical pieces ---------- */
.pawn {
  position: absolute; width: 31px; height: 31px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
  border: 2.5px solid #0a0a18; z-index: 5;
  background-image: radial-gradient(circle at 38% 28%, #ffffff55, transparent 55%);
  transition: left var(--spring-pawn-hop-duration) var(--spring-pawn-hop-ease),
              top var(--spring-pawn-hop-duration) var(--spring-pawn-hop-ease);
  box-shadow: 0 3px 0 rgba(0,0,0,.45), inset 0 -3px 4px rgba(0,0,0,.25);
}
.pawn.leader::after {
  content: "👑"; position: absolute; top: -16px; font-size: 12px;
  animation: crownDrop var(--spring-reveal-pop-duration) var(--spring-reveal-pop-ease) both;
}
@keyframes crownDrop { 0% { transform: translateY(-6px) scale(.6); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
.pawn.wobble { animation: pawnWobble var(--motion-dur-overtake-wobble) ease-in-out both; }
@keyframes pawnWobble { 0%,100% { rotate: 0deg; } 25% { rotate: -11deg; } 60% { rotate: 7deg; } 85% { rotate: -3deg; } }

/* ---------- scoreboard ---------- */
.scoreline {
  display: flex; justify-content: space-between; font-weight: 600; padding: 7px 2px;
  border-bottom: 1.5px dashed #ffffff26; align-items: center; font-variant-numeric: tabular-nums;
}
.scoreline b {                               /* the +delta — a turnYellow chip you win */
  background: var(--color-accent-turn); color: var(--color-text-on-surface);
  border: 2px solid var(--color-border); border-radius: var(--radius-chip);
  padding: 1px 9px; box-shadow: 0 2px 0 #b8860bcc;
}

/* ---------- Home (front of house) ---------- */
.home-lang { max-width: 230px; margin: 2px auto 0; }
.home-badge {
  width: 128px; height: 128px; display: flex; align-items: center; justify-content: center;
  background: var(--color-accent-turn); border: 3px solid var(--color-border);
  border-radius: 28px; box-shadow: var(--shadow-hard);
  background-image: repeating-linear-gradient(0deg, transparent 0 3px, #00000008 3px 4px);   /* paper grain */
}
.home-badge .logo { width: 92px; height: auto; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
.linkbtn {
  display: block; width: 100%; background: none; border: none; cursor: pointer; min-height: 44px;
  color: var(--color-text-secondary); font: inherit; font-weight: 600; font-size: 15px;
  padding: 12px; margin-top: 6px; text-decoration: underline; text-underline-offset: 3px;
}
.linkbtn:active { color: var(--color-text-on-bg); }
.linkbtn:focus-visible { outline: 3px solid var(--color-accent-turn); outline-offset: 2px; }

/* ---------- Regler (how-to) ---------- */
.step { display: flex; gap: 14px; align-items: flex-start; padding: 13px 2px; border-bottom: 1.5px dashed #ffffff26; }
.step:last-of-type { border-bottom: none; }
.step-n {
  flex: none; width: 36px; height: 36px; border-radius: 50%;
  background: var(--color-accent-turn); color: var(--color-text-on-surface);
  border: 2.5px solid var(--color-border); box-shadow: 0 3px 0 #b8860bcc;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 17px; font-family: var(--type-display-family);
}
.step-b b { display: block; font-size: 16px; margin-bottom: 2px; color: var(--color-text-on-bg); }
.step-b small { color: var(--color-text-secondary); font-size: 14px; line-height: 1.4; }
.nose-demo { display: flex; align-items: center; justify-content: center; gap: 30px; margin: 18px 0 8px; }
.scorerow { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1.5px dashed #00000018; }
.scorerow:last-child { border-bottom: none; }
.pt {
  flex: none; min-width: 44px; text-align: center; padding: 4px 8px; border-radius: var(--radius-chip);
  border: 2.5px solid var(--color-border); font-family: var(--type-display-family); font-weight: 800;
  color: var(--color-text-on-surface);
}
.pt.green  { background: var(--color-accent-truth); }
.pt.pink   { background: var(--color-accent-bluff); }
.pt.violet { background: var(--color-accent-gm); color: #fff; }
.pt.gold   { background: var(--color-accent-turn); }

/* themes.css */
/* themes.css — the three boards. Background layers, space skin, pawn flavor ONLY
 * (DESIGN.md §3: themes change clothes, never rules). Lane B. Geometry + pawn
 * physics are shared (screens.css) and never touched here.
 * Adding a theme: one entry in js/themes.js + one block here. */

/* ============================================================
   Salongen — warm wooden parlor: grain + plank seams + lamp pool
   ============================================================ */
.theme-salongen .boardwrap {
  --board-rail: var(--color-theme-salongen-rail);
  background:
    radial-gradient(130% 90% at 50% -12%, #b3823f66 0%, transparent 55%),          /* overhead lamp pool */
    repeating-linear-gradient(93deg,                                                /* fine grain (3° skew) */
      #00000016 0 2px, transparent 2px 5px, #ffffff0c 5px 6px, transparent 6px 24px),
    repeating-linear-gradient(90deg,                                                /* plank seams */
      var(--color-theme-salongen-board-base) 0 47px, #0000002e 47px 50px,
      var(--color-theme-salongen-board-alt)  50px 97px, #0000002e 97px 100px),
    var(--color-theme-salongen-board-base);
}
.theme-salongen .space {
  background: radial-gradient(circle at 38% 30%, #e6c79a 0%, #c49a63 46%, #9a7038 100%);
  border: 2.5px solid #4d341f; color: #3a2614;
  box-shadow:
    inset 0 2px 2px #ffffff55, inset 0 -3px 4px #00000066,
    inset 0 0 0 3px #ffffff22,        /* concentric inlay ring — turned wood */
    0 2px 0 #00000055;
}

/* ============================================================
   Fjellet — layered paper-cut ridges (sky→forest→snow) + cairn discs
   ============================================================ */
.theme-fjellet .boardwrap {
  --board-rail: var(--color-theme-fjellet-rail);
  background:
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" preserveAspectRatio="none" viewBox="0 0 480 300"><polygon points="0,150 90,96 190,150 300,104 400,150 480,120 480,300 0,300" fill="%235e7f74"/><polyline points="0,150 90,96 190,150 300,104 400,150 480,120" fill="none" stroke="%23000" stroke-opacity="0.18" stroke-width="2"/><polygon points="0,205 120,168 240,205 360,172 480,205 480,300 0,300" fill="%236f8f6f"/><polygon points="0,255 90,232 200,258 320,236 420,258 480,244 480,300 0,300" fill="%23e8edf2"/></svg>')
      center/cover no-repeat,
    linear-gradient(180deg,
      var(--color-theme-fjellet-sky)        0%,
      var(--color-theme-fjellet-sky-low)    38%,
      var(--color-theme-fjellet-forest)     60%,
      var(--color-theme-fjellet-forest-low) 80%,
      var(--color-theme-fjellet-snow)       100%);
}
.theme-fjellet .space {
  background:
    radial-gradient(circle at 50% 20%, #f2efe9 0 16%, transparent 17%),   /* crown-stone glint */
    radial-gradient(circle at 36% 34%, #d9d3c7, #a9a294 68%, #837c6e 100%);
  border: 2.5px solid #5a544a; color: #3f3b32;
  box-shadow: inset 0 2px 2px #ffffff66, inset 0 -3px 5px #00000044, 0 2px 0 #00000044;
}

/* ============================================================
   Verdensrommet — deep space: nebula + two star layers + drift + orbit-ring discs
   ============================================================ */
.theme-rom .boardwrap {
  --board-rail: var(--color-theme-verdensrommet-rail);
  background:
    radial-gradient(90% 60% at 18% 8%,  #3a2a6a66, transparent 60%),   /* nebula 1 */
    radial-gradient(80% 60% at 88% 92%, #6d3a9a4d, transparent 60%),   /* nebula 2 */
    var(--color-theme-verdensrommet-space);
  background-image:
    radial-gradient(var(--color-theme-verdensrommet-star-bright) 1.2px, transparent 1.2px),
    radial-gradient(var(--color-theme-verdensrommet-star-dim)    1px,   transparent 1px);
  background-size: 64px 64px, 92px 92px;
  background-position: 0 0, 30px 40px;
}
.theme-rom .boardwrap::before {          /* parallax near-stars, drifts slowly (transform → RM-safe) */
  content: ""; position: absolute; inset: -20%; pointer-events: none;
  background-image:
    radial-gradient(1.6px 1.6px at 40px 60px,   #ffffff, transparent),
    radial-gradient(1.3px 1.3px at 150px 120px, #cfe3ff, transparent),
    radial-gradient(1px 1px     at 240px 200px, #ffffffcc, transparent);
  background-size: 260px 260px;
  animation: starDrift 42s linear infinite; will-change: transform;
}
@keyframes starDrift { to { transform: translate3d(-260px, -130px, 0); } }
.theme-rom .space {
  background: radial-gradient(circle at 50% 50%, #1c1c46 0 54%, #141430 55%);
  border: 2.5px solid var(--color-accent-gm); color: #d6c8ff;
  box-shadow: 0 0 0 2px #9b6dff22, 0 0 12px #9b6dff66 inset, 0 0 10px #9b6dff33;   /* orbit-ring halo */
}

/* ---------- per-theme routed track stroke (drawn by ui.js drawTrack) ---------- */
.theme-salongen .track-path polyline { stroke: #caa15a; }   /* inlaid brass groove */
.theme-fjellet  .track-path polyline { stroke: #ffffffaa; }  /* dotted snow trail */
.theme-rom      .track-path polyline { stroke: #b79bffcc; }  /* faint orbit dashes */

/* ---------- per-theme pawn flavor (shared physics live in screens.css) ---------- */
.theme-fjellet .pawn { box-shadow: 0 3px 0 rgba(0,0,0,.45), inset 0 -3px 4px rgba(0,0,0,.25), 0 0 0 2px #ffffff33; }
.theme-rom .pawn::after {                /* exhaust puff on hop (ui.js adds .hopping ~350 ms) */
  content: ""; position: absolute; bottom: -6px; width: 8px; height: 8px; border-radius: 50%; background: #ffd18a; opacity: 0;
}
.theme-rom .pawn.hopping::after { animation: puff .35s ease-out; }
@keyframes puff { from { opacity: .8; transform: scale(.4); } to { opacity: 0; transform: translateY(8px) scale(1.3); } }

  String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const rnd = (a, b) => a + Math.random() * (b - a);

// Stable-ish id for one device/player. Deliberately NOT crypto.randomUUID():
// that is undefined on non-secure origins, and the standalone bundle has to run
// from file://. Collision risk across a room of eight is not worth a thought.
const newPid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// One timer registry so phase changes can cancel everything pending.
const timers = [];
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
const clearTimers = () => { timers.forEach(clearTimeout); timers.length = 0; };

// Screen-flow state (setup fields + which screen is showing). Engine state
// (scores, bluffs, votes, options) lives in ui.js as `G`, produced by engine.js.
function freshUi() {
  return {
    lang: "nb",
    mode: null,             // "hotseat" | "party"
    screen: "HOME",         // HOME LANG MODE PLAYERS PARTYSETUP SETUP GM_INTRO GM_DASH BLUFF WAIT VOTE VOTEWAIT REVEAL BOARD OMKAMP WINNER · RULES ABOUT
    rulesReturn: "HOME",    // where RULES/ABOUT return to
    names: [],              // hotseat player names (setup)
    uname: "",
    botCount: 3,
    target: 15,
    theme: "salongen",
    deck: [],
    fakePool: [],
    usedFakes: new Set(),
    cur: 0,                 // whose hotseat turn (bluff entry / vote)
    voteIdx: 0,
    afterHand: null,
    myPid: null,            // this device's player id; set once at boot
    draftBluff: "",         // mirrors the bluff textarea so a re-render can't eat it
    // Host's phase-timer choices, made on screen 06 and copied into G at start.
    // ON by default because the modes that use it (party/online) are the ones
    // where one person walking away can freeze everyone else.
    timers: { on: true, bluffMs: 60000, decoyMs: 45000, voteMs: 45000, revealMs: 25000 },
  };
}


/* ===== engine.js ===== */
// engine.js — pure Cocky Monk rules engine. Lane A owns this file (LANES.md).
// No DOM, no timers, no Math.random — randomness comes in via an injected rng.
// Rules authority: Tools/engine-vectors.json (PRD §5.3–§5.5). The SwiftUI
// GameEngine must mirror these functions 1:1; keep every rule in a named,
// separately testable export.

const PHASES = Object.freeze([
  "setup", "card", "bluffing", "voting", "reveal", "board", "omkamp", "winner",
]);

// -- text rules ---------------------------------------------------------------

// Normalization used for dobbeltreff detection and identical-bluff merging.
function normalize(text) {
  return String(text ?? "")
    .toLowerCase()
    .replace(/[.,!?;:«»"'’`-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function isValidBluff(text) {
  return normalize(text).length > 0;
}

// -- option pool --------------------------------------------------------------

// Build the vote pool from submitted bluffs + GM decoys + the truth.
// Dobbeltreff (bluff ≈ truth) is pulled out (author gets +3 later, D3);
// identical bluffs merge into one option with all authors (PRD §5.5).
function buildOptions({ truth, bluffs, decoys, gm, rng }) {
  const doubles = [];
  const byText = new Map(); // normalized text -> option
  for (const [player, text] of Object.entries(bluffs)) {
    const idx = Number(player);
    const norm = normalize(text);
    if (norm === normalize(truth)) { doubles.push(idx); continue; }
    if (byText.has(norm)) byText.get(norm).authors.push(idx);
    else byText.set(norm, { kind: "bluff", authors: [idx], text });
  }
  const options = [...byText.values()];
  for (const text of decoys) options.push({ kind: "decoy", authors: [gm], text });
  options.push({ kind: "truth", authors: [], text: truth });
  shuffle(options, rng);
  options.forEach((o, i) => { o.id = String.fromCharCode(97 + i); });
  return { options, doubles };
}

function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// A voter never sees an option they authored (PRD §5.2#4).
function visibleOptionsFor(options, voter) {
  return options.filter((o) => !o.authors.includes(voter));
}

// -- who is expected to act (PRD §5.2a, §5.5) ---------------------------------
//
// These three are the single source of truth for "is this round waiting on
// anyone?". ui.js imports them for the live game; dispatch() calls them for the
// reducer. Written once on purpose: when the rule lived in two places, a vector
// could pass while the shipped game did something else.
//
// A timed-out player is skipped for THIS ROUND ONLY (D4). They are not dropped:
// they keep their score, still count toward playerCount and the win check, and
// are expected again after the next drawCard.

const egTimedOut = (t) => ({ bluff: t?.bluff ?? [], vote: t?.vote ?? [] });
const egUnion = (a, b) => [...new Set([...a, ...b])].sort((x, y) => x - y);

// Seats that still owe a bluff. In omkamp only the tied players write (PRD §5.4).
function bluffersExpected({ players, gm, inOmkamp = false, omkampParticipants = [], timedOut = null }) {
  const skipped = egTimedOut(timedOut).bluff;
  const base = inOmkamp
    ? omkampParticipants
    : players.map((_, i) => i).filter((i) => i !== gm && !players[i].dropped);
  return base.filter((i) => !skipped.includes(i));
}

// Seats that still owe a vote. In omkamp everyone but the GM votes, including
// players who aren't bluffing this round — mirrors voteOrder() in ui.js.
function votersExpected({ players, gm, inOmkamp = false, timedOut = null }) {
  const skipped = egTimedOut(timedOut).vote;
  const base = players
    .map((_, i) => i)
    .filter((i) => i !== gm && (inOmkamp || !players[i].dropped));
  return base.filter((i) => !skipped.includes(i));
}

// The shuffle may never fire before every expected bluff is in AND the GM's
// decoy state is settled (PRD §5.5 decoy gating).
function readyToOpenVote({ expected, bluffs, gmDecoyDone }) {
  return Boolean(gmDecoyDone) && expected.every((i) => i in bluffs);
}

// -- scoring (PRD §5.3) -------------------------------------------------------

// votes: {voterIndex: optionId}. Returns per-player deltas, the Gullnese
// bluff-vote tally, and whether the GM stole the round.
function scoreRound({ playerCount, gm, options, votes, doubles = [] }) {
  const deltas = Array(playerCount).fill(0);
  const bluffVotes = Array(playerCount).fill(0);
  for (const d of doubles) deltas[d] += 3; // dobbeltreff (+3, merged with truth)

  const votersByOption = new Map();
  for (const [voter, optId] of Object.entries(votes)) {
    if (!votersByOption.has(optId)) votersByOption.set(optId, []);
    votersByOption.get(optId).push(Number(voter));
  }

  let truthFound = false;
  for (const opt of options) {
    const voters = votersByOption.get(opt.id) ?? [];
    if (opt.kind === "truth") {
      for (const v of voters) deltas[v] += 2; // +2 truth vote
      if (voters.length > 0) truthFound = true;
    } else if (voters.length > 0) {
      // +1 per vote to the author; merged options split rounding up (D1),
      // but each author's Gullnese tally is credited the full vote count.
      const share = Math.ceil(voters.length / opt.authors.length);
      for (const a of opt.authors) {
        deltas[a] += share;
        bluffVotes[a] += voters.length;
      }
    }
  }

  const gmStole = !truthFound;
  if (gmStole) deltas[gm] += 2; // "Spillmesteren vant runden!"
  return { deltas, gmStole, bluffVotes };
}

// -- game length & fairness (PRD §5.4) ----------------------------------------

// The win check fires only when a full GM rotation completes (D2).
function winCheck({ scores, round, playerCount, target }) {
  if (round % playerCount !== 0) return { checked: false, winners: null, omkamp: null };
  const past = scores.map((s, i) => ({ s, i })).filter(({ s }) => s >= target);
  if (past.length === 0) return { checked: true, winners: null, omkamp: null };
  const max = Math.max(...past.map(({ s }) => s));
  const leaders = past.filter(({ s }) => s === max).map(({ i }) => i);
  if (leaders.length === 1) return { checked: true, winners: leaders, omkamp: null };
  // Tie past the line → omkamp: tied players bluff, next-highest scorer is GM.
  let omkampGm = null, best = -Infinity;
  scores.forEach((s, i) => {
    if (!leaders.includes(i) && s > best) { best = s; omkampGm = i; }
  });
  return { checked: true, winners: null, omkamp: { participants: leaders, gm: omkampGm } };
}

// Sudden-death resolution: still tied → shared victory, shared confetti.
function omkampResolve({ scores, participants, deltas }) {
  const next = scores.map((s, i) => s + (deltas[i] ?? deltas[String(i)] ?? 0));
  const max = Math.max(...participants.map((i) => next[i]));
  const winners = participants.filter((i) => next[i] === max);
  return { scores: next, winners, shared: winners.length > 1 };
}

// -- state machine ------------------------------------------------------------

function createGame({ players, target, rng }) {
  return {
    phase: "card",
    players: players.map((name) => ({ name, score: 0, bluffVotes: 0, dropped: false })),
    target,
    round: 1,
    gm: 0,
    card: null,
    bluffs: {},
    decoys: [],
    gmDecoyDone: false,
    options: null,
    doubles: [],
    votes: {},
    timedOut: { bluff: [], vote: [] }, // per-round, cleared on drawCard (D4)
    lastResult: null,
    omkamp: null,
    winners: null,
    shared: false,
    rng: rng ?? (() => 0.5),
  };
}

function activeBluffers(state) {
  return bluffersExpected({ players: state.players, gm: state.gm, timedOut: state.timedOut });
}

function allBluffsIn(state) {
  return activeBluffers(state).every((i) => i in state.bluffs);
}

// The shuffle may never fire before the GM decoy state is settled (PRD §5.5).
function canOpenVote(state) {
  return readyToOpenVote({
    expected: activeBluffers(state), bluffs: state.bluffs, gmDecoyDone: state.gmDecoyDone,
  });
}

function allVotesIn(state) {
  return votersExpected({ players: state.players, gm: state.gm, timedOut: state.timedOut })
    .every((i) => i in state.votes);
}

function gmForRound(round, playerCount, firstGm = 0) {
  return (firstGm + round - 1) % playerCount;
}

function dispatch(state, action) {
  switch (action.type) {
    case "drawCard":
      return { ...state, phase: "bluffing", card: action.card, bluffs: {}, decoys: [], gmDecoyDone: false, votes: {}, options: null, doubles: [], timedOut: { bluff: [], vote: [] } };

    case "submitBluff": {
      if (action.player === state.gm) return { ...state, rejected: true };
      if (egTimedOut(state.timedOut).bluff.includes(action.player)) return { ...state, rejected: true }; // window closed
      if (!isValidBluff(action.text)) return { ...state, rejected: true }; // "Selv en dårlig løgn er bedre enn ingen."
      return { ...state, rejected: false, bluffs: { ...state.bluffs, [action.player]: action.text } };
    }

    // -- timeouts (PRD §5.2a). The clock lives outside the engine; expiry
    // arrives as an ordinary action, so every rule below is provable by a
    // vector with no timing in it. Only the host dispatches these.

    case "timeoutBluffs": {
      // Bluff window closed. Whoever hasn't submitted is skipped for this round:
      // their answer never reaches the option pool, so scoreRound sees exactly
      // what it sees for a dropped player — no scoring change needed (R8).
      const pending = action.players
        ?? bluffersExpected({ players: state.players, gm: state.gm, timedOut: state.timedOut })
             .filter((i) => !(i in state.bluffs));
      const bluffs = { ...state.bluffs };
      for (const i of pending) delete bluffs[i];
      const t = egTimedOut(state.timedOut);
      return { ...state, rejected: false, bluffs, timedOut: { ...t, bluff: egUnion(t.bluff, pending) } };
    }

    case "timeoutDecoys":
      // GM ran out of time composing. Whatever they typed stands; the gate opens
      // regardless, which is the same settled state a manual "done" produces (E8).
      return { ...state, rejected: false, decoys: action.decoys ?? state.decoys ?? [], gmDecoyDone: true };

    case "timeoutVotes": {
      // Vote window closed. A missing vote is simply absent from `votes`, which
      // scoreRound already handles — including flipping gmStole if the only
      // truth-voter was the one who timed out (R9).
      const pending = action.players
        ?? votersExpected({ players: state.players, gm: state.gm, timedOut: state.timedOut })
             .filter((i) => !(i in state.votes));
      const votes = { ...state.votes };
      for (const i of pending) delete votes[i];
      const t = egTimedOut(state.timedOut);
      return { ...state, rejected: false, votes, timedOut: { ...t, vote: egUnion(t.vote, pending) } };
    }

    case "gmDecoysDone":
      return { ...state, rejected: false, decoys: action.decoys ?? [], gmDecoyDone: true };

    case "openVote": {
      if (!canOpenVote(state)) return { ...state, rejected: true };
      const { options, doubles } = buildOptions({
        truth: state.card.truth, bluffs: state.bluffs, decoys: state.decoys, gm: state.gm, rng: state.rng,
      });
      return { ...state, rejected: false, phase: "voting", options, doubles };
    }

    case "castVote": {
      if (action.player === state.gm) return { ...state, rejected: true }; // the GM never votes
      if (state.players[action.player]?.dropped) return { ...state, rejected: true };
      if (egTimedOut(state.timedOut).vote.includes(action.player)) return { ...state, rejected: true }; // window closed
      const visible = visibleOptionsFor(state.options ?? [], action.player);
      if (!visible.some((o) => o.id === action.option)) return { ...state, rejected: true };
      return { ...state, rejected: false, votes: { ...state.votes, [action.player]: action.option } };
    }

    case "finishVoting": {
      const result = scoreRound({
        playerCount: state.players.length, gm: state.gm,
        options: state.options, votes: state.votes, doubles: state.doubles,
      });
      const players = state.players.map((p, i) => ({
        ...p, score: p.score + result.deltas[i], bluffVotes: p.bluffVotes + result.bluffVotes[i],
      }));
      return { ...state, phase: "reveal", players, lastResult: result };
    }

    case "completeRound": {
      const scores = state.players.map((p) => p.score);
      const check = winCheck({ scores, round: state.round, playerCount: state.players.length, target: state.target });
      if (check.winners) return { ...state, phase: "winner", winners: check.winners, shared: false };
      if (check.omkamp) return { ...state, phase: "omkamp", omkamp: check.omkamp };
      const round = state.round + 1;
      return { ...state, phase: "card", round, gm: gmForRound(round, state.players.length) };
    }

    case "removePlayer": {
      const players = state.players.map((p, i) => (i === action.player ? { ...p, dropped: true } : p));
      if (action.player === state.gm) {
        // GM dropped → role passes to the next active player, round restarts with a fresh card (PRD §5.5).
        let gm = state.gm;
        do { gm = (gm + 1) % players.length; } while (players[gm].dropped);
        return {
          ...state, players, gm, phase: "card", roundRestarted: true,
          card: null, bluffs: {}, decoys: [], gmDecoyDone: false, votes: {}, options: null, doubles: [],
        };
      }
      const bluffs = { ...state.bluffs }; delete bluffs[action.player];
      const votes = { ...state.votes }; delete votes[action.player];
      return { ...state, players, bluffs, votes, roundRestarted: false };
    }

    default:
      return state;
  }
}

const selectors = {
  activeBluffers, allBluffsIn, canOpenVote, allVotesIn, visibleOptionsFor,
  bluffersExpected, votersExpected, readyToOpenVote,
};


/* ===== clock.js ===== */
// clock.js — phase deadlines for the browser build (PRD §5.2a). Segment 5.
//
// The engine has no clock and never will (LANES.md contract 1). This module
// decides WHEN; the engine then receives an ordinary action it cannot tell
// apart from a player acting. That split is why every timeout rule is provable
// by a vector with no timing in it.
//
// Everything here is built around ONE number: an absolute epoch-ms deadline.
// "45 seconds left" cannot survive a network hop — by the time it arrives it is
// a lie. "Expires at 1774400045000" is still true on every device, so the host
// broadcasts the deadline and each client derives its own display from it.
//
// NO DOM in this file. The per-second repaint is a callback the caller supplies,
// because ui.js must update surgically — a full render() would wipe the bluff
// textarea 60 times a minute. Keeping the DOM out also means the whole module
// runs under `node --test` with no browser.
//
// BUNDLE NOTE: Tools/build-standalone.mjs concatenates every Lab module into
// ONE IIFE, so module-private names here become top-level names shared with
// every other module. state.js already owns `timers`, `later` and `clearTimers`
// — this file must never declare those. Private names are prefixed `ck`.
// (Lab/js/online.test.mjs asserts this, so the rule cannot rot silently.)

const TIMERS = Object.freeze({
  // Phase lengths in ms. The host picks one per phase at game setup; three
  // choices each so screen 06 reuses the existing `.seg` control rather than
  // inventing a slider. Defaults are PRD §5.2a.
  BLUFF: Object.freeze({ choices: [30000, 60000, 120000], default: 60000 }),
  DECOY: Object.freeze({ choices: [30000, 45000, 90000], default: 45000 }),
  VOTE: Object.freeze({ choices: [30000, 45000, 90000], default: 45000 }),
  REVEAL: Object.freeze({ choices: [15000, 25000, 45000], default: 25000 }),

  TICK_MS: 250,        // 4 Hz so the last second never visibly stutters — but the
                       // DOM is only touched when the displayed integer changes.
  WARN_MS: 10000,      // ring → turnYellow, and one VoiceOver announcement
  URGENT_MS: 5000,     // ring → bluffPink and goes hollow (never colour alone)
  SKEW_CLAMP_MS: 5000, // a peer whose clock is wilder than this gets no say
  GRACE_MS: 400,       // someone who tapped at 0:00.1 experienced making it
});

// Bot pacing lives in bots.js TUNING; phase deadlines live here. Two blocks
// because they answer to different masters — see LANES.md contract 5.

// The `timers` slice of G. Defaults OFF: hotseat passes one phone and paces
// itself, and C6 wires the clock in before C7 turns it on anywhere.
const defaultTimers = () => ({
  on: false,
  bluffMs: TIMERS.BLUFF.default,
  decoyMs: TIMERS.DECOY.default,
  voteMs: TIMERS.VOTE.default,
  revealMs: TIMERS.REVEAL.default,
});

// A deadline is a fact about the round, not a countdown. It rides the host's
// broadcast unchanged; `round` and `phase` let a late-arriving expiry prove it
// still refers to the situation it was armed for.
function clockDeadline(phase, ms, round, now = Date.now()) {
  return { at: now + ms, phase, round, totalMs: ms };
}

// ms remaining, clamped at 0. Pure.
function clockLeft(deadline, skewMs = 0, now = Date.now()) {
  if (!deadline?.at) return null;
  return Math.max(0, deadline.at - (now + skewMs));
}

// What the player is shown. Ceil, so "1" means "you still have time".
const clockSeconds = (leftMs) => (leftMs === null ? null : Math.ceil(leftMs / 1000));

function clockLevel(leftMs) {
  if (leftMs === null) return null;
  if (leftMs <= TIMERS.URGENT_MS) return "urgent";
  if (leftMs <= TIMERS.WARN_MS) return "warn";
  return "calm";
}

// Fraction still to run, 1 → 0. Drives the conic-gradient ring.
function clockFraction(deadline, skewMs = 0, now = Date.now()) {
  const left = clockLeft(deadline, skewMs, now);
  if (left === null || !deadline.totalMs) return null;
  return Math.max(0, Math.min(1, left / deadline.totalMs));
}

// Is an arriving submission late? The grace window exists because a player who
// tapped as the ring emptied experienced sending it in time, and a party game
// should resolve that in the player's favour.
function clockExpired(deadline, skewMs = 0, now = Date.now()) {
  if (!deadline?.at) return false;
  return now + skewMs > deadline.at + TIMERS.GRACE_MS;
}

// Offset between this device's clock and the host's, from the timestamp on
// every broadcast. Clamped, and cosmetic by construction: clients never fire
// expiry, so a bad clock can skew a display but never a rule.
function clockSkew(hostNowMs, localNowMs = Date.now(), halfRttMs = 0) {
  const raw = hostNowMs + halfRttMs - localNowMs;
  return Math.max(-TIMERS.SKEW_CLAMP_MS, Math.min(TIMERS.SKEW_CLAMP_MS, raw));
}

// -- the single interval ------------------------------------------------------
// One timer for the whole app, and it is idempotent: clockArm always clears
// first, so a double-arm can never leave two intervals racing.

let ckHandle = null;
let ckArmed = null;
let ckShown = -1;

const clockArmed = () => ckArmed;

/**
 * Arm the phase clock.
 * @param at        absolute epoch ms (from clockDeadline)
 * @param onTick    (leftMs, level) — called only when the displayed second
 *                  changes. This is where the caller does its surgical DOM
 *                  write; it must never trigger a full re-render.
 * @param onExpire  fired once at 0:00. **Pass null unless you are the host.**
 *                  Clients paint and nothing else, which is what makes
 *                  double-advance structurally impossible rather than a race
 *                  we hope to win.
 */
function clockArm({ at, phase, round, totalMs, skewMs = 0, onTick = null, onExpire = null }) {
  clockClear();
  ckArmed = { at, phase, round, totalMs, skewMs, onTick, onExpire };
  ckShown = -1;
  ckTick();                                   // paint now, don't wait 250 ms
  if (ckArmed) ckHandle = setInterval(ckTick, TIMERS.TICK_MS);
  return ckArmed;
}

function clockClear() {
  if (ckHandle !== null) { clearInterval(ckHandle); ckHandle = null; }
  ckArmed = null;
  ckShown = -1;
}

function ckTick() {
  const a = ckArmed;
  if (!a) return;
  const left = clockLeft({ at: a.at }, a.skewMs);
  const secs = clockSeconds(left);
  if (secs !== ckShown) {
    ckShown = secs;
    a.onTick?.(left, clockLevel(left));
  }
  if (left <= 0) {
    const fire = a.onExpire;
    clockClear();          // clear BEFORE firing — onExpire usually re-arms us
    fire?.();
  }
}


/* ===== rating.js ===== */
// rating.js — the career rating (PRD §2.1). Segment 5.
//
// Pairwise-decomposed Elo, the standard adaptation of a two-player system to an
// N-player free-for-all: score each pair independently, then divide by (N−1) so
// an eight-player game swings about as much as a three-player one. Beating
// someone rated above you is worth more, by construction rather than by a bonus
// rule — that falls straight out of (S − E) per pair.
//
// Deliberately NOT TrueSkill or Glicko: both are better models, both need
// priors or a variance term to explain, and neither is worth it for a party
// game whose stake is bragging rights. This fits in a paragraph a player will
// actually read.
//
// No DOM, no network, no imports. The only side effect is one localStorage key,
// and every touch of it is wrapped — Safari in private mode throws on setItem,
// and a profile must never be able to break the boot.
//
// BUNDLE NOTE: concatenated into one IIFE with every other module, so all
// internals are prefixed `rt` (see Tools/build-standalone.mjs).

const RATING = Object.freeze({
  START: 1000,
  FLOOR: 100,          // you can slump, but the number stays a number
  MAX_DELTA: 64,       // also the clamp applied to anything arriving over the wire
  SCALE: 400,          // the classic Elo constant: 400 pts ≈ 10:1 odds
  K_NEW: 40,           // first 10 games — a provisional rating should move fast
  K_MID: 24,           // to 30 games
  K_SET: 16,           // settled
  PROVISIONAL_GAMES: 10,
  SETTLED_GAMES: 30,
  KEY: "cockymonk.profile.v1",
  VERSION: 1,
  HISTORY_MAX: 20,
});

// Tiers are flavour, not mechanics — the number is the truth. Named for noses
// because that is what the game is about (Gullnesen, PRD §5.3).
const rtTIERS = [
  { min: 1600, nb: "Mestermøller", en: "Master liar" },
  { min: 1400, nb: "Storløgner", en: "Grand fibber" },
  { min: 1200, nb: "Rutinert", en: "Seasoned" },
  { min: 1000, nb: "Habil", en: "Capable" },
  { min: 800, nb: "Ærlig sjel", en: "Honest soul" },
  { min: 0, nb: "Blank nese", en: "Blank nose" },
];
const ratingTier = (r, lang = "nb") =>
  (rtTIERS.find((x) => r >= x.min) ?? rtTIERS[rtTIERS.length - 1])[lang];

function ratingK(games) {
  if (games < RATING.PROVISIONAL_GAMES) return RATING.K_NEW;
  if (games < RATING.SETTLED_GAMES) return RATING.K_MID;
  return RATING.K_SET;
}

// Expected score for A against B. 0.5 at equal rating, → 1 as A pulls ahead.
const ratingExpected = (ra, rb) => 1 / (1 + 10 ** ((rb - ra) / RATING.SCALE));

const ratingNewPid = () =>
  Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/**
 * Rating changes for one finished game.
 * @param players [{pid, rating, games, score, isBot}] — final scores.
 * @returns {pid: delta} for RATED players only, or {} if the game doesn't count.
 *
 * Two games deliberately count for nothing:
 *   · fewer than two rated humans — you cannot farm a rating off bots;
 *   · any game that never reached a winner — a friend whose battery dies
 *     should not be punished for it, and neither should the room.
 */
function ratingDeltas(players) {
  const rated = players.filter((p) => p && !p.isBot && p.pid);
  if (rated.length < 2) return {};

  const out = {};
  for (const a of rated) {
    let sum = 0;
    for (const b of rated) {
      if (a === b) continue;
      const actual = a.score > b.score ? 1 : a.score === b.score ? 0.5 : 0;
      sum += actual - ratingExpected(a.rating ?? RATING.START, b.rating ?? RATING.START);
    }
    const raw = ratingK(a.games ?? 0) * (sum / (rated.length - 1));
    out[a.pid] = rtClampDelta(Math.round(raw));
  }
  return out;
}

const rtClampDelta = (d) => Math.max(-RATING.MAX_DELTA, Math.min(RATING.MAX_DELTA, d));

// Applied to a delta arriving from the host. The host computed it, but a host
// is just another player's browser — so the clamp is re-applied on receipt.
// This is the honest bar Specs/ONLINE-PLAY.md sets: make it not-embarrassingly-
// easy, don't pretend a party game has server-grade anti-cheat.
function ratingApply(profile, delta, { nose = 0, won = false } = {}) {
  const d = rtClampDelta(Math.round(Number(delta) || 0));
  const rating = Math.max(RATING.FLOOR, (profile.rating ?? RATING.START) + d);
  const history = [
    ...(profile.history ?? []),
    { d, r: rating, n: Math.max(0, Math.round(Number(nose) || 0)) },
  ].slice(-RATING.HISTORY_MAX);
  return {
    ...profile,
    rating,
    games: (profile.games ?? 0) + 1,
    wins: (profile.wins ?? 0) + (won ? 1 : 0),
    nose: (profile.nose ?? 0) + Math.max(0, Math.round(Number(nose) || 0)),
    best: Math.max(profile.best ?? RATING.START, rating),
    history,
  };
}

// Career nose count has a ceiling per game: every other player can vote for you
// at most once per round. Anything above that didn't happen.
const ratingNoseCap = (playerCount, rounds) =>
  Math.max(0, (playerCount - 1) * Math.max(0, rounds));

// -- storage ------------------------------------------------------------------
// Every read and write is total: a corrupt or unavailable store yields a fresh
// profile rather than an exception, because nothing here is worth a broken boot.

function ratingFresh(name = "") {
  return {
    v: RATING.VERSION,
    pid: ratingNewPid(),
    name,
    rating: RATING.START,
    games: 0,
    wins: 0,
    nose: 0,
    best: RATING.START,
    history: [],
  };
}

function ratingLoad() {
  let raw = null;
  try { raw = globalThis.localStorage?.getItem(RATING.KEY) ?? null; } catch { /* blocked */ }
  if (!raw) return ratingFresh();
  try {
    const p = JSON.parse(raw);
    if (!p || typeof p !== "object" || !p.pid) return ratingFresh();
    // Version switch, not a silent merge: a future v2 gets a real migration
    // here, and anything unrecognised is reseeded rather than half-read.
    if (p.v !== RATING.VERSION) return ratingFresh(typeof p.name === "string" ? p.name : "");
    return { ...ratingFresh(p.name), ...p, v: RATING.VERSION };
  } catch { return ratingFresh(); }
}

function ratingSave(profile) {
  try {
    globalThis.localStorage?.setItem(RATING.KEY, JSON.stringify({ ...profile, v: RATING.VERSION }));
    return true;
  } catch { return false; }   // private mode, quota, disabled storage — all survivable
}

function ratingReset(name = "") {
  try { globalThis.localStorage?.removeItem(RATING.KEY); } catch { /* nothing to undo */ }
  const fresh = ratingFresh(name);
  ratingSave(fresh);
  return fresh;
}

// bots.js — BotBrain for practice mode. Lane A owns this file.
// CLAUDE.md rule: ALL bot tuning constants live in this one block, never inline.
// The SwiftUI BotBrain mirrors this file (constants → BotTuning.swift).
// Pure decision logic + delay policies; actual timers belong to the UI layer.

const TUNING = Object.freeze({
  TRUTH_FIND_RATE: 0.35,          // PRD §4: bots vote the truth 35% of the time
  BLUFF_DELAY_MS: [1800, 3500],   // first bot starts writing while the user still types
  BLUFF_STAGGER_MS: [800, 2200],  // per-bot additional stagger
  VOTE_DELAY_MS: [1500, 3000],
  VOTE_STAGGER_MS: [700, 1800],
  USER_DECOY_MS: [2500, 5000],    // party demo: user's auto-decoy window
  GM_INTRO_AUTO_MS: 2000,         // bot GM advances the intro after 2 s
  GM_SHUFFLE_MS: 1200,            // bot GM: all-bluffs-in → open vote
  REVEAL_BEAT_MS: 1700,           // bot GM auto-paced reveal beat (PRD §4 ~1.7 s)
  REVEAL_TO_BOARD_MS: 1600,
});

const BOT_NAMES = Object.freeze({
  nb: ["Kåre 🤖", "Berit 🤖", "Odd 🤖", "Solveig 🤖", "Trygve 🤖"],
  en: ["Max 🤖", "Ava 🤖", "Pip 🤖", "Ida 🤖", "Leo 🤖"],
});

const inRange = ([lo, hi], rng) => lo + Math.floor(rng() * (hi - lo + 1));

// Randomized human-feeling submission offsets for k bots (ms from phase start).
function bluffOffsets(botCount, rng) {
  return Array.from({ length: botCount }, (_, k) =>
    inRange(TUNING.BLUFF_DELAY_MS, rng) + k * inRange(TUNING.BLUFF_STAGGER_MS, rng));
}

function voteOffsets(botCount, rng) {
  return Array.from({ length: botCount }, (_, k) =>
    inRange(TUNING.VOTE_DELAY_MS, rng) + k * inRange(TUNING.VOTE_STAGGER_MS, rng));
}

// A bot's vote: 35% the truth, otherwise a random option that is neither the
// truth nor its own answer. Falls back to the truth if nothing else is votable.
function botPick(options, botIndex, rng) {
  const votable = options.filter((o) => !o.authors.includes(botIndex));
  const truth = votable.find((o) => o.kind === "truth");
  if (truth && rng() < TUNING.TRUTH_FIND_RATE) return truth.id;
  const lies = votable.filter((o) => o.kind !== "truth");
  if (lies.length === 0) return truth?.id ?? null;
  return lies[Math.floor(rng() * lies.length)].id;
}

// Draw a fake from the pool without repeats within a round (PRD §9).
// `used` is a Set of already-drawn ids, mutated by the caller between draws.
function takeFake(pool, used, rng) {
  const fresh = pool.filter((f) => !used.has(f.id));
  const pick = fresh.length ? fresh[Math.floor(rng() * fresh.length)] : pool[Math.floor(rng() * pool.length)];
  used.add(pick.id);
  return pick;
}


/* ===== audio.js ===== */
// audio.js — sound grammar for the Lab. Lane B may restyle voices; event NAMES
// are the contract (LANES.md seam #4) and mirror tokens.json → sound.grammar.
// A procedural WebAudio "sound designer" (no files) so it works offline; the iOS
// app plays the promoted Kenney/.caf files for the same events.
//
// Design intent (emil-design-eng: "match the motion to the mood"): this is a
// playful quiz-show, so voices lean theatrical — a gong when the vote opens, a
// rising boing per liar's-nose notch, a comedic wah-wah when the GM steals, a
// triumphant chord for the truth. Everything ducks quiet; nothing screeches.

let ctx = null;
let muted = false;
let noiseBuf = null;

function setMuted(m) { muted = m; }
function isMuted() { return muted; }

function ac() {
  if (!ctx) ctx = new (window.AudioContext ?? window.webkitAudioContext)();
  return ctx;
}
function now() { return ac().currentTime; }

// A short white-noise buffer, reused for whooshes/riffles.
function noise() {
  if (!noiseBuf) {
    const a = ac();
    noiseBuf = a.createBuffer(1, a.sampleRate * 0.5, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

// One tone with an ADSR-ish gain envelope. freq may be [from, to] to glide.
function tone(freq, { dur = 0.12, type = "triangle", gain = 0.05, when = 0, attack = 0.006 } = {}) {
  if (muted) return;
  const a = ac();
  const t = a.currentTime + when;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  if (Array.isArray(freq)) { o.frequency.setValueAtTime(freq[0], t); o.frequency.exponentialRampToValueAtTime(Math.max(1, freq[1]), t + dur); }
  else o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.03);
}

// Filtered noise burst — card whoosh / riffle / shuffle.
function whoosh({ dur = 0.18, when = 0, gain = 0.05, from = 1200, to = 400, q = 0.7 } = {}) {
  if (muted) return;
  const a = ac();
  const t = a.currentTime + when;
  const src = a.createBufferSource(); src.buffer = noise();
  const f = a.createBiquadFilter(); f.type = "bandpass"; f.Q.value = q;
  f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(a.destination);
  src.start(t); src.stop(t + dur + 0.02);
}

const CHORD = [523.25, 659.25, 783.99]; // C major, the "truth" chord
